<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.6" stop-color="#ff9f43"/>
      <stop offset="1" stop-color="#ee5253"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes breathe { 0% { opacity: 0.35 } 50% { opacity: 0.9 } 100% { opacity: 0.35 } }
    .halo { animation: breathe 2s ease-in-out infinite }
  </style>
  <circle class="halo" cx="60" cy="60" r="30" fill="#ff9f43" fill-opacity="0.35"/>
  <circle cx="60" cy="60" r="20" fill="url(#core)">
    <animate attributeName="r" values="19;22;19" dur="2s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="60" cy="60" rx="48" ry="18" fill="none" stroke="#c8d6e5" stroke-width="1.5" transform="rotate(-20 60 60)"/>
  <ellipse cx="60" cy="60" rx="36" ry="44" fill="none" stroke="#c8d6e5" stroke-width="1.5" stroke-dasharray="4 4"/>
  <g transform="rotate(-20 60 60)">
    <circle r="6" fill="#54a0ff">
      <animateMotion dur="3s" repeatCount="indefinite" path="M108 60 A48 18 0 1 1 12 60 A48 18 0 1 1 108 60"/>
    </circle>
  </g>
  <circle r="4.5" fill="#1dd1a1">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M60 16 A36 44 0 1 1 60 104 A36 44 0 1 1 60 16"/>
  </circle>
  <rect x="56" y="100" width="8" height="8" rx="2" fill="#5f27cd">
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="-360 60 60" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
