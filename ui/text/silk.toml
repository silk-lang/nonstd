[package]
name = "ui-text"
description = "css-layout's TextMeasure over real fonts, with line breaking, bidi and fallback from std"
version = "0.1.0"
silk-version = "0.1.0-dev.55+b55efdf130d5"
kind = "library"
exports = ["lib", "fonts", "glyphs", "analysis", "shaping", "system"]

[dependencies]
layout = { path = "../../css/layout", package = "css-layout" }
font_collection = { path = "../../fonts/collection", package = "font-collection" }
harfrust = { path = "../../fonts/shape", package = "font-shape" }
read_fonts = { path = "../../fonts/parse", package = "font-parse" }
font_types = { path = "../../fonts/types", package = "font-types" }
raster = { path = "../../fonts/raster", package = "font-raster" }
