[package]
name = "ui-sprites"
description = "SVG icons and decoded images as atlas tiles for the UI renderer"
version = "0.1.0"
silk-version = "0.1.0-dev.47+d5e63a44393e"
kind = "library"
exports = ["lib", "uploads", "icons", "images"]

[dependencies]
atlas = { path = "../../graphics/atlas", package = "graphics-atlas" }
codec = { path = "../../graphics/codec", package = "graphics-codec" }
svg_render = { path = "../../images/svg/render", package = "images-svg-render" }
svg_core = { path = "../../images/svg", package = "images-svg" }
svg_css = { path = "../../css/style", package = "css-style" }
svg_fonts = { path = "../../font/faces", package = "font-faces" }
