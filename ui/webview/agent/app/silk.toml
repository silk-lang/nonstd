[package]
name = "ui-webview-agent-app"
version = "0.1.0"
silk-version = "0.1.0-dev.47+d5e63a44393e"

# The agent browser demo. On Linux it runs pages in Chromium, so building it needs the CEF headers
# scripts/install-cef copies (scripts/run does that). Not a workspace member, like the Chromium
# packages it depends on.
[dependencies]
ui_webview = { path = "../..", package = "ui-webview" }
ui_webview_agent = { path = "..", package = "ui-webview-agent" }
ui_webview_chromium = { path = "../../chromium", package = "ui-webview-chromium" }
chromium = { path = "../../../../platform/webview/chromium", package = "platform-webview-chromium" }
webview = { path = "../../../../platform/webview", package = "platform-webview" }
ui_app = { path = "../../../app", package = "ui-app" }
ui_app_window = { path = "../../../app/window", package = "ui-app-window" }
ui_components = { path = "../../../components", package = "ui-components" }
ui_inspect_server = { path = "../../../inspect/server", package = "ui-inspect-server" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_fixtures = { path = "../../../tree/fixtures", package = "ui-tree-fixtures" }
ui_renderer = { path = "../../../../graphics/ui_renderer", package = "graphics-ui-renderer" }
atlas = { path = "../../../../graphics/atlas", package = "graphics-atlas" }
vector = { path = "../../../../graphics/vector", package = "graphics-vector" }
window = { path = "../../../../platform/window", package = "platform-window" }
webgpu = { path = "../../../../gpu/webgpu", package = "gpu-webgpu" }
