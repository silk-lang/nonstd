[package]
name = "ui-app-window"
description = "Runs a ui-app application in a native window"
version = "0.1.0"
silk-version = "0.1.0-dev.52+6302448abcb7"
kind = "library"
exports = ["lib", "background", "images", "commands"]

[dependencies]
ui_app = { path = "..", package = "ui-app" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
font_collection = { path = "../../../fonts/collection", package = "font-collection" }
atlas = { path = "../../../graphics/atlas", package = "graphics-atlas" }
vector = { path = "../../../graphics/vector", package = "graphics-vector" }
ui_scene = { path = "../../../graphics/ui_scene", package = "graphics-ui-scene" }
ui_renderer = { path = "../../../graphics/ui_renderer", package = "graphics-ui-renderer" }
window = { path = "../../../native/platform/window", package = "platform-window" }
webgpu = { path = "../../../native/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { path = "../../../native/gpu/webgpu/sys", package = "gpu-webgpu-sys" }

codec = { path = "../../../graphics/codec", package = "graphics-codec" }
