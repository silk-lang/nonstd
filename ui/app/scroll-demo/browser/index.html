<!doctype html><meta charset="utf-8"><title>Fieldnotes — browser baseline</title>
<style>
@font-face{font-family:Noto;src:url('/graphics/demo/assets/fonts/NotoSans-Regular.subset.ttf')}@font-face{font-family:Noto;src:url('/graphics/demo/assets/fonts/NotoSans-Bold.subset.ttf');font-weight:700}
*{box-sizing:border-box}body{margin:0;font:16px Noto,sans-serif;color:#253b35;background:#f0f3ef;height:100vh;display:flex;flex-direction:column}header{height:70px;flex:none;display:flex;align-items:center;padding:0 28px;gap:24px;background:#fff}button,select{font:inherit;padding:8px 14px}main{display:flex;flex:1;min-height:0}aside{width:218px;padding:22px;flex:none}#port{flex:1;overflow:auto;min-width:0;overflow-anchor:none}#document{padding:32px;display:flex;flex-direction:column;gap:24px}h1,h2,p,pre{margin:0}h1{font-size:38px;font-weight:400}h2{font-size:28px}p{line-height:1.6}section{padding:28px;background:white;display:flex;flex-direction:column;gap:18px;flex:none}.cv section{content-visibility:auto;contain-intrinsic-size:auto 720px}.tag{position:sticky;top:0;padding:8px;background:#fff;display:flex;align-items:center;gap:8px}small{font-size:11px;color:#6c7b80}.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.photo{display:flex;flex-direction:column;gap:10px}.photo img{width:100%;object-fit:cover}.callout{padding:20px;background:#eaf1ed;display:flex;flex-direction:column;gap:8px}pre{padding:18px;background:#192e35;color:#d9eee5;font:14px Noto;white-space:pre-wrap}.table{display:flex;flex-direction:column;gap:1px;background:#e2e8e5}.tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:12px;background:#f8faf8}.tr:first-child{background:#eaf1ed}
</style>
<header><strong>Fieldnotes</strong><select id="size"><option>100</option><option>1000</option><option>10000</option></select><select id="mode"><option value="cv">Content visibility</option><option value="full">Fully mounted</option></select><button id="run">Measure scrolling</button><span id="status"></span></header><main><aside>Text, photos, tables, code, and sticky headings.<p>Same assets and content as the native Scroll Lab.</p></aside><div id="port"><div id="document"></div></div></main>
<script src="data.js"></script><script>
const port=document.querySelector('#port'),doc=document.querySelector('#document');
function section(i){const el=document.createElement('section');el.innerHTML=`<div class="tag"><small>FIELD NOTE</small>${i+1}<small> / OBSERVE · COLLECT · REFINE</small></div><h2>${titles[i%6]}</h2>`;for(let p=0;p<=i%3;p++)el.innerHTML+=`<p>${paragraphs[(i+p)%4]}</p>`;
if(i%2===0)el.innerHTML+=`<div class="photos">${[0,1].map(c=>{const j=(i+c)%12;return `<div class="photo"><img src="/graphics/demo/assets/photos/photo-${String(j).padStart(2,'0')}.${j%2?'jpg':'png'}" style="height:${190+i%3*24}px" alt="An abstract landscape from the collection"><small>${c?'02 / Another way of seeing':'01 / A study in light and texture'}</small></div>`}).join('')}</div>`;
if(i%3===0)el.innerHTML+='<div class="callout"><small>A THOUGHT TO KEEP</small><p>Leave enough space between ideas for something new to happen.</p></div>';
if(i%3===1)el.innerHTML+='<pre>document {\n    rhythm: generous\n    images: worth a second look\n    details: small, but considered\n    next: keep exploring\n}</pre>';
if(i%3===2)el.innerHTML+=`<div class="table">${[0,1,2,3,4].map(r=>`<div class="tr"><div>${!r?'Observation':r%2?'Material sample':'Color study'}</div><div>${r?'Ready for review':'Status'}</div><div>${r?i*5+r:'Collection'}</div></div>`).join('')}</div>`;
el.innerHTML+='<small>From the field notebook · Updated with care</small>';return el;}
window.setup=async(n=100,mode='cv')=>{await document.fonts.ready;port.scrollTop=0;doc.className=mode;const start=performance.now();const f=document.createDocumentFragment();const h=document.createElement('h1');h.textContent='A notebook without an end.';f.append(h);const p=document.createElement('p');p.textContent='Scroll at your own pace, or start an automatic pass. This document mixes text, photographs, tables, and code.';f.append(p);for(let i=0;i<n;i++)f.append(section(i));doc.replaceChildren(f);await Promise.all([...doc.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));const height=doc.offsetHeight;await new Promise(requestAnimationFrame);await new Promise(requestAnimationFrame);window.mount={sections:n,mode,mountMs:performance.now()-start,nodes:doc.querySelectorAll('*').length,height};return mount;};
window.measure=async(steps=120)=>{port.scrollTop=0;await new Promise(requestAnimationFrame);const intervals=[],sync=[],offsets=[];let previous=await new Promise(requestAnimationFrame);for(let i=0;i<steps;i++){const now=await new Promise(requestAnimationFrame);intervals.push(now-previous);previous=now;const start=performance.now();port.scrollTop+=i<steps/2?96:-96;offsets.push(port.scrollTop);sync.push(performance.now()-start);}window.result={...mount,steps,intervals,sync,offsets,userAgent:navigator.userAgent,dpr:devicePixelRatio,viewport:[innerWidth,innerHeight]};return result;};
window.measurePaced=async(duration=10000,speed=5000)=>{port.scrollTop=0;await new Promise(requestAnimationFrame);await new Promise(requestAnimationFrame);const intervals=[],sync=[];let previous=await new Promise(requestAnimationFrame);const start=previous;while(previous-start<duration){const now=await new Promise(requestAnimationFrame);const delta=now-previous;intervals.push(delta);previous=now;const before=performance.now();port.scrollTop+=Math.min(delta,50)*speed/1000;void port.scrollTop;sync.push(performance.now()-before);}return {...mount,intervals,sync,finalOffset:port.scrollTop,duration,speed,viewport:[innerWidth,innerHeight],dpr:devicePixelRatio,userAgent:navigator.userAgent};};
document.querySelector('#run').onclick=async()=>{document.querySelector('#status').textContent='Measuring…';await setup(+document.querySelector('#size').value,document.querySelector('#mode').value);await measure();document.querySelector('#status').textContent='Complete';};setup();
</script>
