[package]
name = "ui-inspect-server"
description = "The inspector protocol: a running UI answers JSON requests on a local socket"
version = "0.1.0"
silk-version = "0.1.0-dev.47+d5e63a44393e"
kind = "library"
exports = ["lib", "reply", "protocol", "server", "client", "mcp"]

[dependencies]
ui_inspect = { path = "..", package = "ui-inspect" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_scene = { path = "../../../graphics/ui_scene", package = "graphics-ui-scene" }
vector = { path = "../../../graphics/vector", package = "graphics-vector" }
codec = { path = "../../../images/codec", package = "images-codec" }
