[package]
name = "ui-inspect"
description = "The inspector core for ui-tree: snapshots, queries and input for people, tests and agents"
version = "0.1.0"
silk-version = "0.1.0-dev.47+d5e63a44393e"
kind = "library"
exports = ["lib", "query", "overlay", "view", "session", "synth"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
layout = { path = "../../css/layout", package = "css-layout" }
ui_scene = { path = "../../graphics/ui_scene", package = "graphics-ui-scene" }
vector = { path = "../../graphics/vector", package = "graphics-vector" }
