[package]
name = "ui-tree"
description = "The retained UI tree: plain-data mutations, CSS layout, painting into a UI scene"
version = "0.1.0"
silk-version = "0.1.0-dev.47+d5e63a44393e"
kind = "library"
exports = ["lib", "mutation", "style", "resources", "provider", "node", "paint", "tree", "inspect", "batch", "grid", "canvas_text", "input", "interact", "scrollbar", "edit", "caret", "virtual_list", "canvas_view", "anchoring", "image_load", "cssom_view"]

[dependencies]
layout = { path = "../../css/layout", package = "css-layout" }
ui_text = { path = "../text", package = "ui-text" }
font_collection = { path = "../../fonts/collection", package = "font-collection" }
font_raster = { path = "../../fonts/raster", package = "font-raster" }
atlas = { path = "../../graphics/atlas", package = "graphics-atlas" }
ui_scene = { path = "../../graphics/ui_scene", package = "graphics-ui-scene" }
sprites = { path = "../sprites", package = "ui-sprites" }
vector = { path = "../../graphics/vector", package = "graphics-vector" }
codec = { path = "../../graphics/codec", package = "graphics-codec" }
svg_render = { path = "../../svg/render", package = "svg-render" }
svg_core = { path = "../../svg", package = "svg" }
svg_css = { path = "../../css/style", package = "css-style" }
svg_fonts = { path = "../../fonts/faces", package = "font-faces" }
