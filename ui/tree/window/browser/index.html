<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silk app</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #message { position: fixed; left: 16px; right: 16px; bottom: 16px; font: 14px system-ui, sans-serif;
    color: #b00020; white-space: pre-wrap; }
</style>
<div id="app"></div>
<div id="message"></div>
<script type="module">
  import { runApp, unsupported } from '/ui/tree/window/browser/app-host.js';
  const message = document.getElementById('message');
  const check = new URLSearchParams(location.search).has('check');
  const problem = unsupported();
  if (problem) {
    message.textContent = `${problem} Open this page in Chrome or Edge 137 or later.`;
    window.appResult = { error: problem };
  } else {
    runApp({ wasm: '/app.wasm', container: document.getElementById('app'), check })
      .then(status => { window.appResult = { status }; })
      .catch(error => {
        const text = String(error?.message ?? error);
        window.appResult = { error: text };
        message.textContent = text;
        console.error(text);
      });
  }
</script>
