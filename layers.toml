# Retained local layers. Extracted libraries are canonical Git dependencies, checked transitively
# by node scripts/check-layers. Same-rank layers cannot depend on one another.
# Exclusions remain layer-checked and indexed; Windows sockets still need silk-lang/silk#2769.
[excluded]
"examples/crdt-demo" = "crdt sync on Windows needs Silk sockets with silk-lang/silk#2769; SQLite store not set up there"
"examples/crdt-demo/app" = "crdt sync on Windows needs Silk sockets with silk-lang/silk#2769; SQLite store not set up there"
"examples/crdt-demo/tests" = "crdt sync on Windows needs Silk sockets with silk-lang/silk#2769; SQLite store not set up there"
"crdt/server" = "crdt sync on Windows needs Silk sockets with silk-lang/silk#2769; SQLite store not set up there"
"examples/crdt-showcase" = "crdt sync on Windows needs Silk sockets with silk-lang/silk#2769; SQLite store not set up there"
"examples/crdt-showcase/record" = "crdt sync on Windows needs Silk sockets with silk-lang/silk#2769; SQLite store not set up there"
"crdt/store-sqlite" = "crdt sync on Windows needs Silk sockets with silk-lang/silk#2769; SQLite store not set up there"
"crdt/sync" = "crdt sync on Windows needs Silk sockets with silk-lang/silk#2769; SQLite store not set up there"

[[layer]]
name = "data"
rank = 0
paths = ["db", "crdt"]

[[layer]]
name = "examples"
rank = 1
paths = ["examples"]
