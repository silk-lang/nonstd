# Dependency layers. A package may depend only on packages in its own layer or a lower one.
# Layers with the same rank may not depend on each other. The longest matching prefix wins.
# scripts/check-layers enforces this; see the README's "Layers" section.

[[layer]]
name = "standalone"
rank = 0
paths = ["packages/cli", "examples/greet", "examples/git", "examples/serve", "text/xml"]

[[layer]]
name = "data"
rank = 0
paths = ["db", "crdt"]

[[layer]]
name = "native"
rank = 1
paths = ["gpu", "platform"]

[[layer]]
name = "graphics"
rank = 2
paths = ["graphics", "images/codec", "images/svg/geometry"]

[[layer]]
name = "fonts"
rank = 3
paths = ["font", "images/svg/fonts"]

[[layer]]
name = "css"
rank = 3
paths = ["css"]

[[layer]]
name = "svg"
rank = 4
paths = ["images/svg"]

[[layer]]
name = "ui"
rank = 5
paths = ["ui", "graphics/sprites", "graphics/demo/host", "platform/webview/chromium"]

[[layer]]
name = "examples"
rank = 6
paths = ["graphics/demo", "ui/notes", "ui/showcase", "ui/app/scroll-demo", "crdt/demo", "crdt/showcase"]
