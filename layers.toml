# Dependency layers. A package may depend only on packages in its own layer or a lower one.
# Layers with the same rank may not depend on each other. The longest matching prefix wins.
# scripts/check-layers enforces this; see the README's "Layers" section.

# Packages that are deliberately not root workspace members, with the reason. They are still
# layer-checked and listed in the README index, and their own workflow builds them.
[excluded]
"native/terminal/ghostty" = "requires scripts/prepare for the pinned native library; macOS and Linux only"
"examples/terminal-demo" = "requires native/terminal/ghostty/scripts/prepare; macOS and Linux only"
"native/gpu/webgpu/examples-window" = "the dev-only GLFW host needs GLFW 3.4 installed; build it with native/gpu/webgpu/scripts/window"
"examples/crdt-demo" = "crdt sync on Windows needs Silk sockets with silk-lang/silk#2769; SQLite store not set up there"
"examples/crdt-demo/app" = "crdt sync on Windows needs Silk sockets with silk-lang/silk#2769; SQLite store not set up there"
"examples/crdt-demo/tests" = "crdt sync on Windows needs Silk sockets with silk-lang/silk#2769; SQLite store not set up there"
"crdt/server" = "crdt sync on Windows needs Silk sockets with silk-lang/silk#2769; SQLite store not set up there"
"examples/crdt-showcase" = "crdt sync on Windows needs Silk sockets with silk-lang/silk#2769; SQLite store not set up there"
"examples/crdt-showcase/record" = "crdt sync on Windows needs Silk sockets with silk-lang/silk#2769; SQLite store not set up there"
"crdt/store-sqlite" = "crdt sync on Windows needs Silk sockets with silk-lang/silk#2769; SQLite store not set up there"
"crdt/sync" = "crdt sync on Windows needs Silk sockets with silk-lang/silk#2769; SQLite store not set up there"

[[layer]]
name = "standalone"
rank = 0
paths = ["packages/cli", "examples/greet", "examples/git", "examples/serve", "text/xml"]

[[layer]]
name = "data"
rank = 0
paths = ["db", "crdt"]

[[layer]]
name = "native"
rank = 1
paths = ["native"]

[[layer]]
name = "graphics"
rank = 2
paths = ["graphics"]

[[layer]]
name = "fonts"
rank = 3
paths = ["fonts"]

[[layer]]
name = "css"
rank = 3
paths = ["css"]

[[layer]]
name = "svg"
rank = 4
paths = ["svg"]

[[layer]]
name = "ui"
rank = 5
paths = ["ui", "native/platform/webview/chromium"]

[[layer]]
name = "examples"
rank = 6
paths = ["examples"]
