[package]
name = "font-raster"
description = "The UI glyph cache: unhinted glyphs in atlas tiles, shaped lines and text gamma"
version = "0.1.0"
silk-version = "0.1.0-dev.47+d5e63a44393e"
kind = "library"
exports = ["lib", "key", "face", "rasterize", "cache", "color", "gamma", "lines"]

[dependencies]
read_fonts = { path = "../parse/core", package = "font-parse" }
font_types = { path = "../types", package = "font-types" }
font_outline = { path = "../outline", package = "font-outline" }
harfrust = { path = "../shape/core", package = "font-shape" }
vector = { path = "../../graphics/vector/core", package = "graphics-vector" }
codec = { path = "../../graphics/codec", package = "graphics-codec" }
atlas = { path = "../../graphics/atlas", package = "graphics-atlas" }
