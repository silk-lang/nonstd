<!doctype html>
<html>
<head><title>Agent fixture</title>
<style>
  body { font: 14px sans-serif; margin: 0; }
  .spacer { height: 2000px; }
  .ghost { display: none; }
  iframe { border: 3px solid #888; width: 300px; height: 80px; }
</style>
</head>
<body>
<header>
  <nav aria-label="Primary">
    <a href="/docs">Docs</a>
    <a href="/blog">Blog <em>posts</em></a>
    <a>Not a link</a>
  </nav>
</header>
<main>
  <h1>Welcome back</h1>
  <p>Signed in as <strong>julia</strong>. <span class="ghost">secret</span></p>
  <form onsubmit="event.preventDefault(); window.result = 'submitted'">
    <label for="email">Email</label>
    <input id="email" type="email" value="old@example.com">
    <label>Password <input type="password" value="hunter2"></label>
    <label><input type="checkbox" checked> Remember me</label>
    <select aria-label="Plan"><option>Free</option><option selected>Pro</option></select>
    <button type="submit">Sign in</button>
    <button disabled>Disabled</button>
  </form>
  <div hidden><button>Hidden</button></div>
  <div tabindex="0" onclick="window.result = 'custom'">Custom control</div>
  <div contenteditable="true" aria-label="Notes">draft</div>
  <iframe srcdoc="<button onclick=&quot;parent.result = 'framed'&quot;>Inside frame</button>"></iframe>
  <fancy-card></fancy-card>
  <div class="spacer"></div>
  <button onclick="window.result = 'far'">Far away</button>
</main>
<script>
  customElements.define("fancy-card", class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML =
        "<h2>Card</h2><button onclick=\"window.result = 'shadow'\">Shadow button</button>";
    }
  });
</script>
</body>
</html>
