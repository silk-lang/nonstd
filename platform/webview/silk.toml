[package]
name = "platform-webview"
version = "0.1.0"
silk-version = "0.1.0-dev.47+d5e63a44393e"
kind = "library"
exports = ["lib", "types", "command", "event", "host", "headless", "agent", "generated_agent", "macos", "macos_sys", "native"]

# macOS compiles the WKWebView bridge into every program that depends on this package and links
# WebKit. Other targets build nothing native yet. The bridge's views live in platform-window's
# AppKit windows and it calls that bridge (silk_macos_content_view, silk_macos_wake), so a macOS
# program using the WebKit backend also depends on platform-window, as it must to have a window.
# The package itself does not, so its tests build without the window's native libraries.
[native]
sources = [
  { objc = "native/macos/bridge.m", flags = ["-fobjc-arc", "-fblocks", "-O2", "-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter", "-mmacosx-version-min=14.0"], os = "macos" },
]
link = [
  { framework = "WebKit", os = "macos" },
  { framework = "Cocoa", os = "macos" },
  { framework = "QuartzCore", os = "macos" },
]
