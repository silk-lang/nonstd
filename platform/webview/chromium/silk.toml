[package]
name = "platform-webview-chromium"
version = "0.1.0"
silk-version = "0.1.0-dev.47+d5e63a44393e"
kind = "library"
exports = ["lib", "chromium", "options", "input", "sys"]

# The CEF bridge compiles into every program that depends on this package, against the headers of
# the pinned CEF distribution, which scripts/install-cef copies to native/cef/include (not
# committed; run it before building). CEF itself (libcef.so) loads at run time from the runtime
# directory the app names, so nothing here links Chromium. Linux only for now (W6 adds macOS and
# Windows). CEF_API_VERSION must match toolchains.lock.json's cef.api_version (install-cef checks).
[native]
sources = [
  { c = "native/bridge.c", include = ["native/cef"], flags = ["-std=c11", "-O2", "-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter", "-Wno-missing-field-initializers", "-DCEF_API_VERSION=15000"], os = "linux" },
]
link = [
  { library = "dl", mode = "dynamic", os = "linux" },
  { library = "pthread", mode = "dynamic", os = "linux" },
  { library = "m", mode = "dynamic", os = "linux" },
]

[dependencies]
webview = { path = "..", package = "platform-webview" }
window = { path = "../../window", package = "platform-window" }
webgpu = { path = "../../../gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { path = "../../../gpu/webgpu/sys", package = "gpu-webgpu-sys" }
ui_renderer = { path = "../../../graphics/ui_renderer", package = "graphics-ui-renderer" }
images_codec = { path = "../../../images/codec", package = "images-codec" }
