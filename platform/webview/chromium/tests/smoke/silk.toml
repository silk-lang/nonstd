[package]
name = "platform-webview-chromium-smoke"
version = "0.1.0"
silk-version = "0.1.0-dev.47+d5e63a44393e"

# Runs Chromium web views in a real window: `scripts/linux smoke` installs CEF, builds this and
# runs it under Xvfb. Not a workspace member, like the package it tests.
[dependencies]
window = { path = "../../../../window", package = "platform-window" }
webview = { path = "../../..", package = "platform-webview" }
chromium = { path = "../..", package = "platform-webview-chromium" }
webgpu = { path = "../../../../../gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { path = "../../../../../gpu/webgpu/sys", package = "gpu-webgpu-sys" }
ui_scene = { path = "../../../../../graphics/ui_scene", package = "graphics-ui-scene" }
ui_renderer = { path = "../../../../../graphics/ui_renderer", package = "graphics-ui-renderer" }
