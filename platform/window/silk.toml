[package]
name = "platform-window"
version = "0.1.0"
silk-version = "0.1.0-dev.44+8052ef3352b5"
kind = "library"
exports = ["lib", "types", "event", "keys", "menu", "platform", "headless", "macos", "native", "bridge", "bridge_sys"]

# The AppKit bridge and its frameworks reach every macOS executable that depends on this package.
# NSView.displayLink(target:selector:) needs macOS 14.
[native]
sources = [
  { objc = "native/macos/bridge.m", flags = ["-fobjc-arc", "-fblocks", "-O2", "-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter", "-Wno-deprecated-declarations", "-mmacosx-version-min=14.0"], os = "macos" },
]
link = [
  { framework = "Cocoa", os = "macos" },
  { framework = "QuartzCore", os = "macos" },
  { framework = "UniformTypeIdentifiers", os = "macos" },
]
