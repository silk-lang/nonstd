[package]
name = "platform-window-tests-macos"
version = "0.1.0"
silk-version = "0.1.0-dev.44+8052ef3352b5"

[dependencies]
window = { path = "../..", package = "platform-window" }

# scripts/macos stages the bridge archive here; Silk does not yet pass native link inputs
# on from dependencies (silk-lang/silk#2595).
[native]
link = [
  { static-archive = "native/libsilkwindow.a" },
  { framework = "Cocoa" },
  { framework = "QuartzCore" },
  { framework = "UniformTypeIdentifiers" },
]
