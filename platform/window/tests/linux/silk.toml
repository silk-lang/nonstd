[package]
name = "platform-window-tests-linux"
version = "0.1.0"
silk-version = "0.1.0-dev.44+8052ef3352b5"

[dependencies]
smoke = { path = "../smoke", package = "platform-window-tests-smoke" }

# scripts/linux stages the bridge archive here; Silk does not yet pass native link inputs on
# from dependencies (silk-lang/silk#2595).
[native]
link = [
  { static-archive = "native/libsilkwindow.a" },
  { library = "X11", mode = "dynamic" },
  { library = "xkbcommon", mode = "dynamic" },
  { library = "wayland-client", mode = "dynamic" },
  { library = "wayland-cursor", mode = "dynamic" },
]
