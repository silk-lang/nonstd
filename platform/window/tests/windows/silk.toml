[package]
name = "platform-window-tests-windows"
version = "0.1.0"
silk-version = "0.1.0-dev.43+3808a7f2e30c"

[dependencies]
smoke = { path = "../smoke", package = "platform-window-tests-smoke" }

# scripts/windows stages the bridge library here; Silk does not yet pass native link inputs
# on from dependencies (silk-lang/silk#2595).
[native]
link = [
  { static-archive = "native/silkwindow.lib" },
  { library = "user32", mode = "dynamic" },
  { library = "gdi32", mode = "dynamic" },
  { library = "imm32", mode = "dynamic" },
  { library = "dwmapi", mode = "dynamic" },
  { library = "shell32", mode = "dynamic" },
  { library = "comdlg32", mode = "dynamic" },
  { library = "ole32", mode = "dynamic" },
  { library = "uxtheme", mode = "dynamic" },
  { library = "uuid", mode = "dynamic" },
  { library = "advapi32", mode = "dynamic" },
  { library = "kernel32", mode = "dynamic" },
  { library = "ucrt", mode = "dynamic" },
  { library = "vcruntime", mode = "dynamic" },
]
