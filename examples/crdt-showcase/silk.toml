[package]
name = "crdt-showcase"
description = "Six scripted people writing one rich-text document at once, drawn live"
version = "0.1.0"
silk-version = "0.1.0-dev.63+657e3c900f65"
kind = "library"
exports = ["script", "stage"]

[dependencies]
core = { path = "../../crdt/core", package = "crdt-core" }
sync = { path = "../../crdt/sync", package = "crdt-sync" }
ui_app = { git = "https://github.com/silk-lang/lib-ui.git", rev = "07d9a8b5fdf22d82d2595fcc706d8a7b56a31b91", path = "modules/app", package = "ui-app" }
ui_tree = { git = "https://github.com/silk-lang/lib-ui.git", rev = "07d9a8b5fdf22d82d2595fcc706d8a7b56a31b91", path = "modules/tree", package = "ui-tree" }
showcase = { path = "../showcase", package = "ui-showcase" }
