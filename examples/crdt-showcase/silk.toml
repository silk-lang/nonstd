[package]
name = "crdt-showcase"
description = "Six scripted people writing one rich-text document at once, drawn live"
version = "0.1.0"
silk-version = "0.1.0-dev.63+657e3c900f65"
kind = "library"
exports = ["script", "stage"]

[dependencies]
core = { path = "../../crdt/core", package = "crdt-core" }
sync = { path = "../../crdt/sync", package = "crdt-sync" }
ui_app = { git = "https://github.com/silk-lang/lib-ui.git", rev = "86a0492202b7b931078666811cc813d51a2c0616", path = "ui/app", package = "ui-app" }
ui_tree = { git = "https://github.com/silk-lang/lib-ui.git", rev = "86a0492202b7b931078666811cc813d51a2c0616", path = "ui/tree", package = "ui-tree" }
showcase = { path = "../showcase", package = "ui-showcase" }
