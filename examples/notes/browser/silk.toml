[package]
name = "ui-notes-browser"
version = "0.1.0"
silk-version = "0.1.0-dev.54+524349ca083e"

[dependencies]
ui_notes = { path = "..", package = "ui-notes" }
ui_app = { path = "../../../ui/app", package = "ui-app" }
ui_app_window = { path = "../../../ui/app/window", package = "ui-app-window" }
ui_tree_window = { path = "../../../ui/tree/window", package = "ui-tree-window" }
ui_inspect_server = { path = "../../../ui/inspect/server", package = "ui-inspect-server" }
ui_tree = { path = "../../../ui/tree", package = "ui-tree" }
ui_fixtures = { path = "../../../ui/tree/fixtures", package = "ui-tree-fixtures" }
atlas = { path = "../../../graphics/atlas", package = "graphics-atlas" }
vector = { path = "../../../graphics/vector", package = "graphics-vector" }
window = { path = "../../../native/platform/window", package = "platform-window" }
webgpu = { path = "../../../native/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { path = "../../../native/gpu/webgpu/sys", package = "gpu-webgpu-sys" }

# `ui/tree/window/scripts/browser` builds with these. A deep layout, such as Studio's 100k cards
# demo, overflows the default 1 MiB wasm stack; native threads get 8 MiB.
[profiles.browser]
target = "wasm32-unknown-unknown"
optimization = "speed"
debug = false
stack-size = "8MiB"

[profiles.browser-debug]
target = "wasm32-unknown-unknown"
optimization = "none"
debug = true
stack-size = "8MiB"
