[package]
name = "graphics-demo"
description = "The UI drawing layer's integration demo, natively and in the browser"
version = "0.1.0"
silk-version = "0.1.0-dev.58+9840d5811e54"
kind = "library"
exports = ["lib", "text", "uploads", "demo", "cpu"]

[dependencies]
ui_assets = { path = "../../ui/assets", package = "ui-assets" }
vector = { path = "../../graphics/vector", package = "graphics-vector" }
atlas = { path = "../../graphics/atlas", package = "graphics-atlas" }
ui_scene = { path = "../../graphics/ui_scene", package = "graphics-ui-scene" }
sprites = { path = "../../ui/sprites", package = "ui-sprites" }
font_raster = { path = "../../fonts/raster", package = "font-raster" }
