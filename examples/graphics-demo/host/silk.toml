[package]
name = "graphics-demo-host"
description = "The shared native host that draws a UI scene in a platform window"
version = "0.1.0"
silk-version = "0.1.0-dev.47+d5e63a44393e"
kind = "library"
exports = ["lib", "frames", "events"]

[dependencies]
demo = { path = "../core", package = "graphics-demo" }
atlas = { path = "../../../graphics/atlas", package = "graphics-atlas" }
vector = { path = "../../../graphics/vector/core", package = "graphics-vector" }
ui_scene = { path = "../../../graphics/ui_scene/core", package = "graphics-ui-scene" }
ui_renderer = { path = "../../../graphics/ui_renderer/core", package = "graphics-ui-renderer" }
gpu_scene = { path = "../../../graphics/gpu_scene/core", package = "graphics-gpu-scene" }
webgpu = { path = "../../../native/gpu/webgpu/core", package = "gpu-webgpu" }
webgpu_sys = { path = "../../../native/gpu/webgpu/sys/core", package = "gpu-webgpu-sys" }
window = { path = "../../../native/platform/window/core", package = "platform-window" }
