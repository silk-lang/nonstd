[package]
name = "graphics-demo-host"
description = "The shared native host that draws a UI scene in a platform window"
version = "0.1.0"
silk-version = "0.1.0-dev.63+657e3c900f65"
kind = "library"
exports = ["lib", "frames", "events"]

[dependencies]
demo = { path = "..", package = "graphics-demo" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "3e4532ee810f7b28d6eb6c7331809de81cdcbc7e", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "3e4532ee810f7b28d6eb6c7331809de81cdcbc7e", path = "modules/vector", package = "graphics-vector" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "3e4532ee810f7b28d6eb6c7331809de81cdcbc7e", path = "modules/ui_scene", package = "graphics-ui-scene" }
ui_renderer = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "3e4532ee810f7b28d6eb6c7331809de81cdcbc7e", path = "modules/ui_renderer", package = "graphics-ui-renderer" }
gpu_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "3e4532ee810f7b28d6eb6c7331809de81cdcbc7e", path = "modules/gpu_scene", package = "graphics-gpu-scene" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "2647dff3423cd555b5e6389be4110d8adffcb577", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "2647dff3423cd555b5e6389be4110d8adffcb577", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "2647dff3423cd555b5e6389be4110d8adffcb577", path = "modules/platform/window", package = "platform-window" }
