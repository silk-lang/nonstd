[package]
name = "graphics-demo-host"
description = "The shared native host that draws a UI scene in a platform window"
version = "0.1.0"
silk-version = "0.1.0-dev.63+657e3c900f65"
kind = "library"
exports = ["lib", "frames", "events"]

[dependencies]
demo = { path = "..", package = "graphics-demo" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b1093a18d6333137c9ede3feef8f548790396fdd", path = "graphics/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b1093a18d6333137c9ede3feef8f548790396fdd", path = "graphics/vector", package = "graphics-vector" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b1093a18d6333137c9ede3feef8f548790396fdd", path = "graphics/ui_scene", package = "graphics-ui-scene" }
ui_renderer = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b1093a18d6333137c9ede3feef8f548790396fdd", path = "graphics/ui_renderer", package = "graphics-ui-renderer" }
gpu_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b1093a18d6333137c9ede3feef8f548790396fdd", path = "graphics/gpu_scene", package = "graphics-gpu-scene" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "86a56a1058e0c144dc2241890b9a3bfedd3883da", path = "native/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "86a56a1058e0c144dc2241890b9a3bfedd3883da", path = "native/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "86a56a1058e0c144dc2241890b9a3bfedd3883da", path = "native/platform/window", package = "platform-window" }
