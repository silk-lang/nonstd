[package]
name = "crdt-demo"
description = "Two people editing one rich-text document through an in-process sync server"
version = "0.1.0"
silk-version = "0.1.0-dev.61+91f335268900"
kind = "library"
exports = ["editor"]

[dependencies]
core = { path = "../../crdt/core", package = "crdt-core" }
sync = { path = "../../crdt/sync", package = "crdt-sync" }
ui_app = { git = "https://github.com/silk-lang/lib-ui.git", rev = "20018b7d7350cd68923f417bdbeda461637b4e4d", path = "ui/app", package = "ui-app" }
ui_tree = { git = "https://github.com/silk-lang/lib-ui.git", rev = "20018b7d7350cd68923f417bdbeda461637b4e4d", path = "ui/tree", package = "ui-tree" }
examples = { git = "https://github.com/silk-lang/lib-ui.git", rev = "20018b7d7350cd68923f417bdbeda461637b4e4d", path = "ui/app/examples", package = "ui-app-examples" }
