[package]
name = "crdt-demo"
description = "Two people editing one rich-text document through an in-process sync server"
version = "0.1.0"
silk-version = "0.1.0-dev.63+657e3c900f65"
kind = "library"
exports = ["editor"]

[dependencies]
core = { path = "../../crdt/core", package = "crdt-core" }
sync = { path = "../../crdt/sync", package = "crdt-sync" }
ui_app = { git = "https://github.com/silk-lang/lib-ui.git", rev = "c32bccd2ca5ff1ae4f13902b6d405826e2bfb2f8", path = "modules/app", package = "ui-app" }
ui_tree = { git = "https://github.com/silk-lang/lib-ui.git", rev = "c32bccd2ca5ff1ae4f13902b6d405826e2bfb2f8", path = "modules/tree", package = "ui-tree" }
examples = { git = "https://github.com/silk-lang/lib-ui.git", rev = "c32bccd2ca5ff1ae4f13902b6d405826e2bfb2f8", path = "modules/app/examples", package = "ui-app-examples" }
