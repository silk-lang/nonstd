<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="9s" repeatCount="indefinite"/>
    <ellipse cx="32" cy="32" rx="28" ry="9" fill="none" stroke="#000" stroke-width="2.6"/>
    <ellipse cx="32" cy="32" rx="28" ry="9" fill="none" stroke="#000" stroke-width="2.6" transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="28" ry="9" fill="none" stroke="#000" stroke-width="2.6" transform="rotate(120 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="5">
    <animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
