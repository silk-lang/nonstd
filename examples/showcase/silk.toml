[package]
name = "ui-showcase"
description = "Silk Loom, a showcase of the drawing layer and the UI stack"
version = "0.1.0"
silk-version = "0.1.0-dev.63+657e3c900f65"
kind = "library"
exports = ["lib", "generated_assets", "assets", "palette", "weave", "loom"]

[dependencies]
ui_assets = { git = "https://github.com/silk-lang/lib-ui.git", rev = "c32bccd2ca5ff1ae4f13902b6d405826e2bfb2f8", path = "modules/assets", package = "ui-assets" }
ui_app = { git = "https://github.com/silk-lang/lib-ui.git", rev = "c32bccd2ca5ff1ae4f13902b6d405826e2bfb2f8", path = "modules/app", package = "ui-app" }
ui_tree = { git = "https://github.com/silk-lang/lib-ui.git", rev = "c32bccd2ca5ff1ae4f13902b6d405826e2bfb2f8", path = "modules/tree", package = "ui-tree" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "4f07e6219d274b5247d39d6b3539958bf68bd00c", path = "modules/collection", package = "font-collection" }
