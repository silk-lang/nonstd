[package]
name = "ui-showcase"
description = "Silk Loom, a showcase of the drawing layer and the UI stack"
version = "0.1.0"
silk-version = "0.1.0-dev.61+91f335268900"
kind = "library"
exports = ["lib", "generated_assets", "assets", "palette", "weave", "loom"]

[dependencies]
ui_assets = { git = "https://github.com/silk-lang/lib-ui.git", rev = "4cd7ada085bce4194c05c50db30322a509636b05", path = "ui/assets", package = "ui-assets" }
ui_app = { git = "https://github.com/silk-lang/lib-ui.git", rev = "4cd7ada085bce4194c05c50db30322a509636b05", path = "ui/app", package = "ui-app" }
ui_tree = { git = "https://github.com/silk-lang/lib-ui.git", rev = "4cd7ada085bce4194c05c50db30322a509636b05", path = "ui/tree", package = "ui-tree" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "6ed6967f4b8d7b1738d8d0947fae59d5f3add627", path = "fonts/collection", package = "font-collection" }
