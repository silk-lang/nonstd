[package]
name = "ui-showcase"
description = "Silk Loom, a showcase of the drawing layer and the UI stack"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
kind = "library"
exports = ["lib", "generated_assets", "assets", "palette", "weave", "loom"]

[dependencies]
ui_assets = { git = "https://github.com/silk-lang/lib-ui.git", rev = "27bc7a57bd850b4b7614cf578ac364ebb74dc5e6", path = "modules/assets", package = "ui-assets" }
ui_app = { git = "https://github.com/silk-lang/lib-ui.git", rev = "27bc7a57bd850b4b7614cf578ac364ebb74dc5e6", path = "modules/app", package = "ui-app" }
ui_tree = { git = "https://github.com/silk-lang/lib-ui.git", rev = "27bc7a57bd850b4b7614cf578ac364ebb74dc5e6", path = "modules/tree", package = "ui-tree" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ea3425ff6f35c387e532a7816d43e7fc6bfb1d4f", path = "modules/collection", package = "font-collection" }
