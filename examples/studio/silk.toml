[package]
name = "silk-studio-native"
description = "Silk Studio, a design editor on the UI stack"
version = "0.1.0"
silk-version = "0.1.0-dev.54+524349ca083e"
kind = "library"
exports = ["model", "view", "editing", "samples", "format", "render", "exports"]

[dependencies]
ui_app = { path = "../../ui/app", package = "ui-app" }
ui_components = { path = "../../ui/components", package = "ui-components" }
ui_tree = { path = "../../ui/tree", package = "ui-tree" }
ui_scene = { path = "../../graphics/ui_scene", package = "graphics-ui-scene" }
editor = { path = "../../graphics/editor", package = "graphics-editor" }
atlas = { path = "../../graphics/atlas", package = "graphics-atlas" }
vector = { path = "../../graphics/vector", package = "graphics-vector" }
font_collection = { path = "../../fonts/collection", package = "font-collection" }
codec = { path = "../../graphics/codec", package = "graphics-codec" }
