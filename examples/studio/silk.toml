[package]
name = "silk-studio-native"
description = "Silk Studio, a design editor on the UI stack"
version = "0.1.0"
silk-version = "0.1.0-dev.63+657e3c900f65"
kind = "library"
exports = ["model", "view", "editing", "samples", "format", "render", "exports"]

[dependencies]
ui_app = { git = "https://github.com/silk-lang/lib-ui.git", rev = "c32bccd2ca5ff1ae4f13902b6d405826e2bfb2f8", path = "modules/app", package = "ui-app" }
ui_components = { git = "https://github.com/silk-lang/lib-ui.git", rev = "c32bccd2ca5ff1ae4f13902b6d405826e2bfb2f8", path = "modules/components", package = "ui-components" }
ui_tree = { git = "https://github.com/silk-lang/lib-ui.git", rev = "c32bccd2ca5ff1ae4f13902b6d405826e2bfb2f8", path = "modules/tree", package = "ui-tree" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "3e4532ee810f7b28d6eb6c7331809de81cdcbc7e", path = "modules/ui_scene", package = "graphics-ui-scene" }
editor = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "3e4532ee810f7b28d6eb6c7331809de81cdcbc7e", path = "modules/editor", package = "graphics-editor" }
