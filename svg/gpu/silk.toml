[package]
name = "svg-gpu"
description = "Draws SVG display lists on the GPU through graphics-gpu-scene"
version = "0.1.0"
silk-version = "0.1.0-dev.58+9840d5811e54"
kind = "library"
exports = ["scene"]

[dependencies]
svg_core = { path = "..", package = "svg" }
svg_raster = { path = "../raster", package = "svg-raster" }
vector = { path = "../../graphics/vector", package = "graphics-vector" }
gpu_scene = { path = "../../graphics/gpu_scene", package = "graphics-gpu-scene" }
webgpu = { path = "../../native/gpu/webgpu", package = "gpu-webgpu" }
