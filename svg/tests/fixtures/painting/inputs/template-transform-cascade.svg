<svg xmlns="http://www.w3.org/2000/svg" width="24" height="8">
  <defs>
    <linearGradient id="base" gradientUnits="userSpaceOnUse" x2="8" gradientTransform="translate(4)">
      <stop offset=".5" stop-color="red"/><stop offset=".5" stop-color="blue"/>
    </linearGradient>
    <linearGradient id="inherited" href="#base"/>
    <linearGradient id="none" href="#base" style="transform: none"/>
    <linearGradient id="initial" href="#base" style="transform: initial"/>
  </defs>
  <rect width="8" height="8" fill="url(#inherited)"/>
  <g transform="translate(8)"><rect width="8" height="8" fill="url(#none)"/></g>
  <g transform="translate(16)"><rect width="8" height="8" fill="url(#initial)"/></g>
</svg>
