[package]
name = "svg-render"
description = "Parses, resolves and renders SVG with the vector CPU backend"
version = "0.1.0"
silk-version = "0.1.0-dev.47+d5e63a44393e"
kind = "library"
exports = ["lib", "record", "environment", "native_environment"]

[dependencies]
svg_geometry = { path = "../../graphics/geometry", package = "graphics-geometry" }
svg_core = { path = "../core", package = "svg" }
svg_raster = { path = "../raster", package = "svg-raster" }
svg_xml = { path = "../../text/xml/core", package = "text-xml" }
svg_css = { path = "../../css/style", package = "css-style" }
read_fonts = { path = "../../fonts/parse/core", package = "font-parse" }
# CPU output is the backend-owned pixmap; encoding borrows its pixels without a copy.
vector = { path = "../../graphics/vector/core", package = "graphics-vector" }
svg_fonts = { path = "../../fonts/faces", package = "font-faces" }
