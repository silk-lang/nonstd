[package]
name = "svg-text"
description = "SVG text layout: font selection, shaping, positioning and glyph outlines"
version = "0.1.0"
silk-version = "0.1.0-dev.56+f7d93cff9716"
kind = "library"
exports = ["lib", "layout", "lines", "areas", "paths", "on_path"]

[dependencies]
svg_fonts = { path = "../../fonts/faces", package = "font-faces" }
harfrust = { path = "../../fonts/shape", package = "font-shape" }
read_fonts = { path = "../../fonts/parse", package = "font-parse" }
font_types = { path = "../../fonts/types", package = "font-types" }
svg_geometry = { path = "../../graphics/geometry", package = "graphics-geometry" }
font_outline = { path = "../../fonts/outline", package = "font-outline" }
