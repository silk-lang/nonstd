[package]
name = "svg"
description = "An SVG renderer written from the SVG 1.1 and SVG 2 specifications"
version = "0.1.0"
silk-version = "0.1.0-dev.58+9840d5811e54"
kind = "library"
exports = ["image_assets", "mask_layer_sources", "svg_intrinsic", "scene", "mapping", "resolve", "url", "resources", "resources_native", "style_tree", "stylesheets", "document_styles", "font_metrics", "vector_path", "view_fragment", "view_selection", "conditional", "structure", "occurrence_tree", "animation", "css_animations", "color_profiles"]

[dependencies]
svg_geometry = { path = "../graphics/geometry", package = "graphics-geometry" }
svg_xml = { path = "../text/xml", package = "text-xml" }
svg_css = { path = "../css/style", package = "css-style" }
svg_image = { path = "../graphics/codec", package = "graphics-codec" }
font_types = { path = "../fonts/types", package = "font-types" }
read_fonts = { path = "../fonts/parse", package = "font-parse" }
harfrust = { path = "../fonts/shape", package = "font-shape" }
vector = { path = "../graphics/vector", package = "graphics-vector" }
