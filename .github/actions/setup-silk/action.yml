name: Set up Silk
description: Install the Silk compiler pinned in toolchains.lock.json and select the runner's LLVM 22 clang.
inputs:
  clang-version:
    description: Exact clang-22 version the runner must provide; a change is reviewed here instead of downloaded.
    default: 22.1.2
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cache/silk
          .cache/downloads
        key: silk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json') }}
    - name: Install the pinned Silk compiler
      shell: bash
      run: python3 scripts/install-silk >> "$GITHUB_PATH"
    - name: Select the runner's LLVM 22 clang
      shell: bash
      run: |
        set -euo pipefail
        clang="$(command -v clang-22)" || { echo "Runner prerequisite missing: clang-22" >&2; exit 1; }
        if ! "$clang" --version | grep -q "clang version ${{ inputs.clang-version }} "; then
          echo "Runner LLVM changed; review .github/actions/setup-silk: $("$clang" --version | head -1)" >&2
          exit 1
        fi
        echo "SILK_CLANG=$(readlink -f "$clang")" >> "$GITHUB_ENV"
