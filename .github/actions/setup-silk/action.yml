name: Set up retained workspace
description: Bootstrap pinned Silk, fetch canonical dependencies serially, then provision through pinned lib-native.
inputs:
  native-options:
    description: Optional --linux-gpu or --browser flags for native CI provisioning.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cache/silk
          ~/.silk/git
        key: retained-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', '**/silk.toml') }}
    - name: Install retained native application prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols xvfb weston
    - name: Bootstrap compiler and pinned native prerequisites
      shell: bash
      env:
        NATIVE_OPTIONS: ${{ inputs.native-options }}
      run: node scripts/setup-ci.mjs $NATIVE_OPTIONS
