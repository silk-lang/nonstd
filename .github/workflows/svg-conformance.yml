# Full upstream suites: too large for PR CI (15-minute budget), so weekly and on demand.
# Every case carries a reviewed expectation; the reports list any unexpected outcome.
name: images-svg-conformance
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: images-svg-conformance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suites:
    name: SVG W3C 1.1, resvg and WPT suites
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - name: Install native SVG fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: images/svg/scripts/requirements.txt
      - run: python3 -m pip install -r images/svg/scripts/requirements.txt
      - uses: actions/cache@v4
        with:
          path: images/svg/tests/.cache/suites
          key: svg-full-suites-${{ hashFiles('images/svg/tests/suites.lock.json') }}
      - name: Fetch the pinned full suites
        run: |
          for suite in w3c-svg11 resvg wpt; do
            python3 images/svg/scripts/fetch-suites --suite "$suite" --full
          done
      - name: Build the CLI
        run: silk build --release --manifest-path images/svg/cli/silk.toml --target x86_64-unknown-linux-gnu
      # The W3C documents are 100% sized for a 480 by 360 viewport, and read images from
      # sibling directories of svg/, so the suite root is the resource directory.
      - name: W3C SVG 1.1
        if: always()
        run: >
          python3 images/svg/scripts/reftests --suite w3c-svg11 --full
          --renderer '["build/llvm/x86_64-unknown-linux-gnu/release/images-svg-cli", "{input}", "-o", "{output}",
          "--viewport-width", "480", "--viewport-height", "360", "--resources-dir", "{root}"]'
          --report build/svg-conformance/w3c-svg11.json --diff-dir build/svg-conformance/w3c-svg11-diffs > /dev/null
      # The resvg harness renders at width 300 with the suite's fonts and English as the
      # user language.
      - name: resvg
        if: always()
        run: >
          python3 images/svg/scripts/reftests --suite resvg --full
          --renderer '["build/llvm/x86_64-unknown-linux-gnu/release/images-svg-cli", "{input}", "-o", "{output}",
          "--width", "300", "--resources-dir", "{root}", "--font-dir", "{root}/crates/resvg/tests/fonts",
          "--language", "en"]'
          --report build/svg-conformance/resvg.json --diff-dir build/svg-conformance/resvg-diffs > /dev/null
      - name: WPT reftests
        if: always()
        run: >
          python3 images/svg/scripts/reftests --suite wpt --full
          --renderer '["build/llvm/x86_64-unknown-linux-gnu/release/images-svg-cli", "{input}", "-o", "{output}",
          "--resources-dir", "{root}"]'
          --report build/svg-conformance/wpt.json --diff-dir build/svg-conformance/wpt-diffs > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/svg-conformance/
          if-no-files-found: warn
          retention-days: 30
