name: platform-webview
on:
  pull_request:
    paths:
      - platform/webview/**
      - platform/window/native/macos/**
      - platform/window/src/macos*.silk
      - silk.toml
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/platform-webview.yml
  push:
    branches: [main]
    paths:
      - platform/webview/**
      - toolchains.lock.json
      - .github/workflows/platform-webview.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-webview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    name: Unit tests (headless backend) and type-checks for every target
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - name: The embedded agent script is current
        run: python3 platform/webview/scripts/embed-agent --check
      - name: Formatting
        run: |
          set -euo pipefail
          for package in platform/webview platform/webview/tests/macos; do
            (cd "$package" && silkc format --check)
          done
      - name: Unit tests
        working-directory: platform/webview
        run: silkc test --root src/tests.silk
      - name: Type-check for every target
        working-directory: platform/webview
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin \
            x86_64-pc-windows-msvc wasm32-unknown-unknown; do
            silkc check --target "$target"
          done
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            (cd tests/macos && silkc check --target "$target")
          done
  agent:
    name: Agent page script in Chromium
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/playwright
            .cache/downloads
          key: platform-webview-agent-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gpu/webgpu/scripts/ci-lock.json') }}
      - name: Validate existing Chromium and install pinned Playwright JavaScript only
        run: python3 gpu/webgpu/scripts/setup-ci --browser
      - name: Snapshot golden, and native clicks and typing at the located elements
        run: node platform/webview/agent/test.mjs
  macos:
    name: macOS arm64 WebKit smoke test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/llvm
            .cache/downloads
          key: platform-webview-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json') }}
      - name: Install the pinned Silk compiler and LLVM 22
        run: |
          set -euo pipefail
          python3 scripts/install-silk >> "$GITHUB_PATH"
          echo "SILK_CLANG=$(python3 scripts/install-llvm)" >> "$GITHUB_ENV"
          rm -f .cache/downloads/LLVM-*.tar.xz
      - name: WKWebView in a real window (AppKit on its own stack)
        run: |
          set -euo pipefail
          python3 platform/webview/scripts/macos smoke 2>&1 | tee smoke.log
          grep -q "AppKit runs on its own stack" smoke.log
      - name: WKWebView in a real window (AppKit on the caller's stack)
        env:
          SILK_WINDOW_FIBER: "0"
        run: |
          set -euo pipefail
          python3 platform/webview/scripts/macos smoke 2>&1 | tee smoke.log
          grep -q "AppKit runs on the caller's stack" smoke.log
