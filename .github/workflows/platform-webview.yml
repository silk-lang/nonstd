name: platform-webview
on:
  pull_request:
    paths:
      - platform/webview/**
      - platform/window/native/macos/**
      - platform/window/native/windows/**
      - platform/window/src/macos*.silk
      - platform/window/scripts/windows
      - scripts/prepare-windows
      - scripts/install-webview2
      - ui/app/window/**
      - ui/inspect/server/**
      - ui/webview/**
      - silk.toml
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/platform-webview.yml
  push:
    branches: [main]
    paths:
      - platform/webview/**
      - ui/webview/**
      - toolchains.lock.json
      - .github/workflows/platform-webview.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-webview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    name: Unit tests (headless backend) and type-checks for every target
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - name: The embedded agent script is current
        run: python3 platform/webview/scripts/embed-agent --check
      - name: Formatting
        run: |
          set -euo pipefail
          for package in platform/webview platform/webview/tests/native; do
            (cd "$package" && silkc format --check)
          done
      - name: Unit tests
        working-directory: platform/webview
        run: silkc test --root src/tests.silk
      - name: Type-check for every target
        working-directory: platform/webview
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin \
            x86_64-pc-windows-msvc wasm32-unknown-unknown; do
            silkc check --target "$target"
          done
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            (cd tests/native && silkc check --target "$target")
          done
  component:
    name: ui-webview component tests, and type-checks for every target
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - name: Install what platform-window's Linux bridge builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols
      - name: Formatting
        run: |
          set -euo pipefail
          for package in ui/webview ui/webview/tests ui/webview/chromium ui/webview/agent \
            ui/webview/agent/app ui/app/window platform/webview/examples/browser; do
            (cd "$package" && silk format --check)
          done
      - name: The component on the headless backend
        working-directory: ui/webview/tests
        run: silk test --root src/tests.silk
      - name: The agent on a scripted brain (tool calls, results, errors, stopping)
        working-directory: ui/webview/agent
        run: silk test --root src/tests.silk
      - name: Type-check for every target
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            (cd ui/webview && silk check --target "$target")
            (cd platform/webview/examples/browser && silk check --target "$target")
            (cd ui/webview/agent/app && silk check --target "$target")
          done
          (cd ui/webview/chromium && silk check)
  agent:
    name: Agent page script in Chromium
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/playwright
            .cache/downloads
          key: platform-webview-agent-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gpu/webgpu/scripts/ci-lock.json') }}
      - name: Validate existing Chromium and install pinned Playwright JavaScript only
        run: python3 gpu/webgpu/scripts/setup-ci --browser
      - name: Snapshot golden, and native clicks and typing at the located elements
        run: node platform/webview/agent/test.mjs
  macos:
    name: macOS arm64 WebKit smoke test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            .cache/llvm
            .cache/downloads
          key: platform-webview-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json') }}
      - name: Install the pinned Silk compiler and LLVM 22
        run: |
          set -euo pipefail
          python3 scripts/install-silk >> "$GITHUB_PATH"
          echo "SILK_CLANG=$(python3 scripts/install-llvm)" >> "$GITHUB_ENV"
          rm -f .cache/downloads/LLVM-*.tar.xz
      - name: WKWebView in a real window (AppKit on its own stack)
        run: |
          set -euo pipefail
          python3 platform/webview/scripts/macos smoke 2>&1 | tee smoke.log
          grep -q "AppKit runs on its own stack" smoke.log
      - name: WKWebView in a real window (AppKit on the caller's stack)
        env:
          SILK_WINDOW_FIBER: "0"
        run: |
          set -euo pipefail
          python3 platform/webview/scripts/macos smoke 2>&1 | tee smoke.log
          grep -q "AppKit runs on the caller's stack" smoke.log
      - name: Build the browser demo, run it and capture the screen
        run: |
          set -euo pipefail
          program=$(python3 platform/webview/scripts/macos demo --build-only --release | tail -1)
          "$program" > demo.log 2>&1 &
          pid=$!
          sleep 15
          screencapture -x browser-demo.png || true
          kill -0 "$pid"
          kill "$pid"
          cat demo.log
      - name: The agent demo signs the guest book (scripted agent, WebKit)
        run: python3 ui/webview/agent/scripts/run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-demo
          path: browser-demo.png
          if-no-files-found: ignore
  windows:
    name: Windows x64 WebView2 smoke test
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      SILK_HOME: ${{ github.workspace }}\.silk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/llvm
            .cache/downloads
            .cache/webgpu
            .cache/glfw
            .cache/webview2
          key: platform-webview-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json') }}
      - name: Install the pinned Silk compiler and LLVM 22
        shell: pwsh
        run: |
          python scripts/install-silk >> $env:GITHUB_PATH
          $clang = python scripts/install-llvm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SILK_CLANG=$clang" >> $env:GITHUB_ENV
      - name: Edge WebView2 Runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $installed = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if ($installed) { "WebView2 Runtime $installed"; exit 0 }
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe" -ArgumentList '/silent', '/install' -Wait
          "WebView2 Runtime $((Get-ItemProperty -Path $key).pv)"
      - name: WebView2 in a real window (message loop on its own fiber)
        run: python platform/webview/scripts/windows smoke
      - name: WebView2 in a real window (message loop on the caller's stack)
        env:
          SILK_WINDOW_FIBER: "0"
        run: python platform/webview/scripts/windows smoke
      - name: The agent demo signs the guest book (scripted agent, WebView2)
        run: python ui/webview/agent/scripts/run check
