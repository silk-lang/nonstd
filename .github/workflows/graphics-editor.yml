name: graphics-editor
on:
  pull_request:
    paths:
      - graphics/editor/**
      - graphics/ui_scene/**
      - graphics/ui_renderer/**
      - graphics/vector/**
      - graphics/atlas/**
      - gpu/webgpu/**
      - silk.toml
      - toolchains.lock.json
      - .github/workflows/graphics-editor.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: graphics-editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/llvm
            .cache/playwright
            .cache/downloads
          key: editor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json') }}
      - name: Configure existing LLVM and Chromium, install pinned Playwright JavaScript
        run: python3 gpu/webgpu/scripts/setup-ci --browser
      - name: Install the pinned Silk compiler
        run: python3 scripts/install-silk >> "$GITHUB_PATH"
      - name: Native contracts, WASM build and browser contracts
        env:
          EDITOR_SOFTWARE_GPU: '1'
        run: xvfb-run -a python3 graphics/editor/scripts/check --browser
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: editor-browser
          path: build/editor-results/
          if-no-files-found: warn
