name: svg-gpu
on:
  pull_request:
    paths:
      - svg/**
      - graphics/codec/**
      - graphics/vector/**
      - graphics/gpu_scene/**
      - native/gpu/webgpu/**
      - text/xml/**
      - css/style/**
      - font/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/workflows/svg-gpu.yml
  push:
    branches: [main]
    paths:
      - svg/**
      - graphics/vector/**
      - graphics/gpu_scene/**
      - native/gpu/webgpu/**
      - toolchains.lock.json
      - .github/workflows/svg-gpu.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: svg-gpu-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  check:
    name: SVG reftest inputs through gpu_scene on lavapipe
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            ~/.silk/archives
            .cache/llvm
            .cache/downloads
          key: svg-vector-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'native/gpu/webgpu/scripts/ci-lock.json') }}
      - name: Pin lavapipe and validate preinstalled LLVM22
        run: python3 native/gpu/webgpu/scripts/setup-ci
      - name: Package checks and formatting
        run: |
          set -e
          silk="$(python3 scripts/install-silk)/silk"
          for package in svg/gpu svg/gpu/tests; do
            "$silk" check --manifest-path "$package/silk.toml"
            "$silk" format --check --manifest-path "$package/silk.toml"
          done
      - name: CPU and GPU renders of the reftest inputs
        run: python3 svg/scripts/test-gpu
