name: SQLite
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: SQLite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sqlite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path db/sqlite/silk.toml
      - run: silk test --manifest-path db/sqlite/silk.toml --root src/tests.silk
