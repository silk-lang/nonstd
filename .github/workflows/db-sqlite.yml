name: db-sqlite
on:
  pull_request:
    paths:
      - db/sqlite/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/db-sqlite.yml
  push:
    branches: [main]
    paths:
      - db/sqlite/**
      - toolchains.lock.json
      - .github/workflows/db-sqlite.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: db-sqlite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux tests against the pinned SQLite amalgamation
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path db/sqlite/silk.toml
      - run: silk test --manifest-path db/sqlite/silk.toml --root src/tests.silk
  macos:
    name: macOS arm64 tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/llvm
            .cache/downloads
          key: db-sqlite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json') }}
      - name: Install the pinned Silk compiler and LLVM 22
        run: |
          set -euo pipefail
          python3 scripts/install-silk >> "$GITHUB_PATH"
          echo "SILK_CLANG=$(python3 scripts/install-llvm)" >> "$GITHUB_ENV"
          rm -f .cache/downloads/LLVM-*.tar.xz
      - run: silk test --manifest-path db/sqlite/silk.toml --root src/tests.silk
