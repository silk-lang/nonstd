name: text-gpu-lexer
on:
  pull_request:
    paths:
      - text/gpu-lexer/**
      - gpu/webgpu/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/workflows/text-gpu-lexer.yml
  push:
    branches: [main]
    paths:
      - text/gpu-lexer/**
      - gpu/webgpu/**
      - toolchains.lock.json
      - .github/workflows/text-gpu-lexer.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: text-gpu-lexer-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  check:
    name: CPU passes and both models against the original on lavapipe
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            .cache/llvm
            .cache/downloads
          key: text-gpu-lexer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json') }}
      - name: Pin lavapipe and validate preinstalled LLVM22
        run: python3 gpu/webgpu/scripts/setup-ci
      - name: Generated modules, packages, unit tests and fixture parity
        run: python3 text/gpu-lexer/scripts/check
