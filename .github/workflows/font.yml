# Budget: 15 minutes wall clock per job, worst case, cold caches.
# Slow differential checks against Rust read-fonts and harfrust run weekly (baseline jobs).
name: font
on:
  pull_request:
    paths:
      - font/**
      - graphics/vector/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/font.yml
  push:
    branches: [main]
    paths:
      - font/**
      - graphics/vector/**
      - toolchains.lock.json
      - .github/workflows/font.yml
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
permissions:
  contents: read
concurrency:
  group: font-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
env:
  READ_FONTS_PROFILE: release
jobs:
  tests:
    name: font-types and font-parse tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: silk test --manifest-path fonts/types/silk.toml --root src/tests.silk
      - run: silk test --manifest-path fonts/parse/core/silk.toml --root src/tests.silk
      - run: silk test --manifest-path fonts/outline/silk.toml --root src/tests.silk

  codegen:
    name: Generated code, formatting and tools
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-silk
      - uses: actions/cache@v4
        with:
          path: |
            css/style/.cache/encodings
            svg/.cache/idna
          key: svg-generated-inputs-${{ hashFiles('css/style/encodings.lock.json', 'svg/core/idna.lock.json') }}
      - name: Hydrate pinned SVG generation inputs
        run: |
          svg/core/scripts/generate-encodings --fetch
          svg/core/scripts/generate-idna --fetch
      - name: Generated and formatted files are committed
        run: fonts/scripts/generate --check
      - name: Codegen tool
        run: |
          cargo fmt --manifest-path fonts/parse/tools/font-codegen-silk/Cargo.toml --check
          cargo clippy --locked --manifest-path fonts/parse/tools/font-codegen-silk/Cargo.toml --target-dir build/codegen --all-targets -- -D warnings
          cargo test --locked --manifest-path fonts/parse/tools/font-codegen-silk/Cargo.toml --target-dir build/codegen
      - name: Script tests
        run: python3 -m unittest discover -s fonts/scripts/tests

  robustness:
    name: Corpus and corrupted fonts
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-silk
      - name: Build release font-parse-dump
        run: silk build --release --manifest-path fonts/parse/tools/dump/silk.toml
      - name: CLI
        run: |
          build/llvm/x86_64-unknown-linux-gnu/release/font-parse-dump --help
          build/llvm/x86_64-unknown-linux-gnu/release/font-parse-dump --version
      - name: Every corpus font and 4 corrupted variants of each dump cleanly
        run: fonts/scripts/check-robustness --mutations-per-font 4
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robustness-failures
          path: build/robustness-failures/
          if-no-files-found: ignore

  shaping:
    name: Native Silk shaping
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-silk
      - name: Library unit tests
        run: rm -rf build/llvm build/cache && silk test --release --manifest-path fonts/shape/core/silk.toml --root src/tests.silk
      - name: Build the shaping runner once
        run: rm -rf build/llvm build/cache && silk build --release --manifest-path fonts/shape/tools/cli/silk.toml
      - name: Pinned shaping cases
        run: build/llvm/x86_64-unknown-linux-gnu/release/font-shape-cli --suite fonts/shape/core/tests/shaping.bin
      - name: Long-input regressions
        run: build/llvm/x86_64-unknown-linux-gnu/release/font-shape-cli --regressions
      - name: Tracing integration
        run: fonts/scripts/check-shaping-trace
      - name: Malformed input smoke checks
        run: fonts/scripts/check-shaping-malformed
      - name: Upload failing shaping inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shaping-failures
          path: build/shaping-malformed-failures/
          if-no-files-found: ignore

  wasm:
    name: WebAssembly shaping
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-silk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fonts/shape/tools/wasm/js/package-lock.json
      - name: Build font-shape-wasm for wasm32
        run: |
          PATH="$(dirname "$SILK_CLANG"):$PATH"
          command -v wasm-ld || { sudo apt-get update && sudo apt-get install -y lld; }
          fonts/scripts/build-wasm
      - name: JS wrapper matches native shaping
        working-directory: fonts/shape/tools/wasm/js
        run: |
          npm ci
          npm run typecheck
          npm test

  baseline-parse:
    name: Rust read-fonts differential baseline
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-silk
      - name: Build release dumpers
        run: fonts/scripts/build --release
      - name: Rust reference dumper
        run: |
          cargo fmt --manifest-path fonts/scripts/rust-font-dump/Cargo.toml --check
          cargo clippy --locked --manifest-path fonts/scripts/rust-font-dump/Cargo.toml --target-dir build/rust --all-targets -- -D warnings
          cargo test --locked --manifest-path fonts/scripts/rust-font-dump/Cargo.toml --target-dir build/rust
      - name: Reference corpus
        run: |
          fonts/scripts/font-list --output build/fonts.txt --report build/corpus-inventory.json
          fonts/scripts/verify-reference --timeout 600 --report build/reference-report.json
      - name: Corpus dumps
        if: ${{ !cancelled() }}
        run: fonts/scripts/compare --timeout 600 --report build/parity-report.json
      - name: Fixtures
        if: ${{ !cancelled() }}
        run: |
          status=0
          fonts/scripts/check-core-fixtures || status=1
          for kind in table layout variation aat cff model misc-table; do
            fonts/scripts/check-$kind-fixtures --report build/$kind-fixtures-report.json || status=1
          done
          exit $status
      - name: Malformed corpus
        if: ${{ !cancelled() }}
        # Keep forkserver/spawn workers from reexecuting the unguarded script entry point.
        # https://github.com/silk-lang/nonstd/issues/33
        env:
          PYTHONPATH: fonts/scripts
        run: python3 -c 'from malformed import main; raise SystemExit(main())' --report build/malformed-report.json.gz
      - name: Speed
        if: ${{ !cancelled() }}
        run: fonts/scripts/benchmark --report build/benchmark-report.json
      - name: Library speed
        if: ${{ !cancelled() }}
        run: fonts/scripts/bench-library
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline-reports
          path: |
            build/*.json
            build/*.json.gz
            build/malformed-failures/
          if-no-files-found: ignore

  baseline-shape:
    name: Rust harfrust differential and performance baseline
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-silk
      - run: silk build --release --manifest-path fonts/shape/tools/cli/silk.toml
      - run: cargo build --locked --release --manifest-path fonts/scripts/rust-hr-shape/Cargo.toml --target-dir build/harfrust-rust
      - name: Rust shaping harness
        run: |
          cargo fmt --manifest-path fonts/scripts/rust-hr-shape/Cargo.toml --check
          cargo clippy --locked --manifest-path fonts/scripts/rust-hr-shape/Cargo.toml --target-dir build/harfrust-rust --all-targets -- -D warnings
      - name: Shaping comparisons
        run: fonts/scripts/compare-shaping | tee build/shaping-comparison.txt
      - name: Corrupted shaping corpus
        if: ${{ !cancelled() }}
        run: fonts/scripts/check-shaping-malformed --all-fonts --mutations-per-font 16 | tee build/shaping-malformed.txt
      - name: Pinned workloads and checksums
        if: ${{ !cancelled() }}
        run: fonts/scripts/bench-shaping | tee build/shaping-benchmark.txt
      - name: Upload shaping results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shaping-baseline
          path: |
            build/shaping-*.txt
            build/shaping-malformed-failures/
          if-no-files-found: ignore
