name: cli
on:
  pull_request:
    paths:
      - packages/cli/**
      - examples/**
      - silk.toml
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/cli.yml
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests and examples
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - name: Package tests
        working-directory: packages/cli
        run: silk test --root src/tests.silk
      - name: Examples
        run: |
          set -euo pipefail
          (cd examples/greet && silk run -- --name Julia --times 2)
          for example in git serve; do (cd "examples/$example" && silk build); done
