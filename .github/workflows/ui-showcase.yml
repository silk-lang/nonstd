name: Showcase
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: Showcase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  showcase:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path examples/showcase/silk.toml
      - run: silk format --check --manifest-path examples/showcase/record/silk.toml
      - run: silk format --check --manifest-path examples/showcase/app/silk.toml
      - run: node examples/showcase/scripts/embed-assets --check
      - run: silk check --manifest-path examples/showcase/app/silk.toml
      - name: Scripted CPU frame recording
        run: node examples/showcase/scripts/record --frames-only --fps 10 --seconds 7.7 --scale 1 --debug
