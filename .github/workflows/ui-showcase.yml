name: ui-showcase
on:
  pull_request:
    paths:
      - examples/showcase/**
      - ui/app/src/**
      - ui/app/window/src/**
      - ui/tree/src/**
      - ui/inspect/src/**
      - ui/inspect/server/**
      - ui/text/src/**
      - fonts/collection/**
      - fonts/raster/**
      - css/layout/src/**
      - graphics/ui_scene/**
      - ui/sprites/**
      - graphics/atlas/**
      - graphics/vector/src/**
      - ui/assets/src/generated_assets.silk
      - toolchains.lock.json
      - .github/workflows/ui-showcase.yml
  push:
    branches: [main]
    paths:
      - examples/showcase/**
      - .github/workflows/ui-showcase.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-showcase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  showcase:
    name: Format, embedded assets, window app check, headless frames
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path examples/showcase/silk.toml
      - run: silk format --check --manifest-path examples/showcase/record/silk.toml
      - run: silk format --check --manifest-path examples/showcase/app/silk.toml
      - run: python3 examples/showcase/scripts/embed-assets --check
      - run: silk check --manifest-path examples/showcase/app/silk.toml
      - name: Record a few frames headless (scripted pointer, CPU renderer)
        run: python3 examples/showcase/scripts/record --frames-only --fps 10 --seconds 7.7 --scale 1 --debug
