name: ui-text
on:
  pull_request:
    paths:
      - ui/text/**
      - font/collection/**
      - font/shape/src/**
      - font/parse/src/**
      - font/types/**
      - font/raster/**
      - font/faces/**
      - images/svg/tests/fonts/**
      - css/layout/src/**
      - silk.toml
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/ui-text.yml
  push:
    branches: [main]
    paths:
      - ui/text/**
      - font/collection/**
      - css/layout/src/**
      - toolchains.lock.json
      - .github/workflows/ui-text.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-text-${{ github.ref }}
  cancel-in-progress: true
jobs:
  text:
    name: Font collection, text system tests and Chrome text comparison
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path font/collection/silk.toml
      - run: silk format --check --manifest-path ui/text/silk.toml
      - run: silk format --check --manifest-path ui/text/cli/silk.toml
      - run: silk test --manifest-path ui/text/silk.toml --root src/tests.silk
      - run: silk build --manifest-path ui/text/cli/silk.toml
      - name: Line breaks and positions agree with Chrome
        run: node ui/text/scripts/chrome-text.mjs --cli build/llvm/x86_64-unknown-linux-gnu/debug/ui-text-cli
      - run: silk check --manifest-path ui/text/silk.toml --target wasm32-unknown-unknown
