name: graphics-ui-scene
on:
  pull_request:
    paths:
      - graphics/ui_scene/**
      - graphics/vector/**
      - graphics/atlas/**
      - graphics/codec/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/graphics-ui-scene.yml
  push:
    branches: [main]
    paths:
      - graphics/ui_scene/**
      - graphics/vector/**
      - graphics/atlas/**
      - graphics/codec/**
      - toolchains.lock.json
      - .github/workflows/graphics-ui-scene.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: graphics-ui-scene-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scene:
    name: Ordering, batching, cache and CPU renderer tests, goldens, wasm32 check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path graphics/ui_scene/core/silk.toml
      - run: silk format --check --manifest-path graphics/ui_scene/tests/silk.toml
      - run: silk test --manifest-path graphics/ui_scene/core/silk.toml --root src/tests.silk
      - run: silk check --manifest-path graphics/ui_scene/core/silk.toml --target wasm32-unknown-unknown
      - name: Compare the CPU reference with the golden images
        run: |
          silk build --manifest-path graphics/ui_scene/tests/silk.toml
          build/llvm/x86_64-unknown-linux-gnu/debug/graphics-ui-scene-tests graphics/ui_scene/tests/goldens
