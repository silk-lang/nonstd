name: gpu-webgpu
on:
  pull_request:
    paths:
      - gpu/webgpu/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/workflows/webgpu.yml
  push:
    branches: [main]
    paths:
      - gpu/webgpu/**
      - toolchains.lock.json
      - .github/workflows/webgpu.yml
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
concurrency:
  group: gpu-webgpu-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
env:
  CACHE_PATHS: |
    .cache/silk
    .cache/webgpu
    .cache/llvm
    .cache/downloads
    gpu/webgpu/.cache/webgpu-headers
jobs:
  linux:
    name: Ubuntu26 lavapipe
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATHS }}
          key: webgpu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json', 'gpu/webgpu/scripts/schema-lock.json') }}
      - name: Pin lavapipe and validate preinstalled LLVM22
        run: python3 gpu/webgpu/scripts/setup-ci
      - name: Freshness, packages, native scenarios and six pixel samples
        run: python3 gpu/webgpu/scripts/check

  # The remaining jobs are slower or need other hosts; they run weekly and on demand.
  linux-window:
    name: Linux X11 GLFW surface and resize
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATHS }}
          key: webgpu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json', 'gpu/webgpu/scripts/schema-lock.json') }}
      - name: Install pinned lavapipe and X11 test prerequisites
        run: |
          python3 gpu/webgpu/scripts/setup-ci
          sudo apt-get install --yes --no-install-recommends libglfw3-dev pkg-config xvfb xauth xdotool
      - name: Build and exercise the real GLFW native surface
        run: python3 gpu/webgpu/scripts/test-window
      - name: Preserve compact presentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x11-surface-proof
          path: gpu/webgpu/.cache/window-proof/
          if-no-files-found: warn
          retention-days: 7
  macos:
    name: macOS26 arm64 Metal
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATHS }}
          key: webgpu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json', 'gpu/webgpu/scripts/schema-lock.json') }}
      - name: Freshness, packages, native scenarios and six pixel samples
        run: python3 gpu/webgpu/scripts/check
  browser:
    name: Compiled Silk wasm in installed Chromium
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/llvm
            .cache/playwright
            .cache/downloads
            gpu/webgpu/.cache/webgpu-headers
          key: webgpu-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json', 'gpu/webgpu/scripts/schema-lock.json') }}
      - name: Validate existing Chromium and install pinned Playwright JavaScript only
        run: python3 gpu/webgpu/scripts/setup-ci --browser
      - name: Freshness, packages and browser pixel/compute tests
        run: python3 gpu/webgpu/scripts/check --skip-native --browser
  benchmarks:
    name: Ubuntu26 lavapipe C versus Silk instruction counts
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: gpu/webgpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CACHE_PATHS }}
            gpu/webgpu/.cache/bench/rust-target
          key: webgpu-benchmarks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json', 'gpu/webgpu/bench/rust/Cargo.lock', 'gpu/webgpu/bench/rust/build.rs', 'gpu/webgpu/bench/rust/markers.c') }}
      - name: Pin lavapipe and validate preinstalled LLVM22
        run: python3 scripts/setup-ci
      - name: Install measured profiling prerequisites
        # Versions inspected in Ubuntu resolute main's amd64 Packages index.
        run: sudo apt-get install --yes --no-install-recommends valgrind=1:3.26.0-0ubuntu1 g++=4:15.2.0-5ubuntu1
      - name: Build real C, safe Silk and Rust workloads with client markers
        env:
          BENCH_CALLGRIND: '1'
        run: python3 scripts/bench --build-only
      - name: Measure five checked C and Silk workloads
        run: python3 scripts/ab .cache/bench/c .cache/bench/silk --n 10000 --frames 3 --repeats 3
      - name: Retain instruction counts, binary hashes and allocator call trees
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: webgpu-callgrind-${{ github.run_id }}-${{ github.run_attempt }}
          path: gpu/webgpu/.cache/bench/ab
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
