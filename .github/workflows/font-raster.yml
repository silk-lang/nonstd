name: font-raster
on:
  pull_request:
    paths:
      - fonts/raster/**
      - fonts/outline/**
      - fonts/parse/core/src/**
      - fonts/shape/core/src/**
      - fonts/types/**
      - graphics/vector/**
      - graphics/atlas/**
      - svg/tests/fonts/**
      - graphics/codec/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/font-raster.yml
  push:
    branches: [main]
    paths:
      - fonts/raster/**
      - fonts/outline/**
      - graphics/vector/**
      - graphics/atlas/**
      - toolchains.lock.json
      - .github/workflows/font-raster.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: font-raster-${{ github.ref }}
  cancel-in-progress: true
jobs:
  raster:
    name: Glyph cache, line cache and text goldens, native and wasm32 checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path fonts/raster/silk.toml
      - run: silk test --manifest-path fonts/raster/silk.toml --root src/tests.silk
      - run: silk check --manifest-path fonts/raster/silk.toml --target wasm32-unknown-unknown
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: font-raster-goldens
          path: build/font-raster/
          if-no-files-found: ignore
