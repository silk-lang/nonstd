name: text-ucd
on:
  pull_request:
    paths:
      - text/ucd/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/text-ucd.yml
  push:
    branches: [main]
    paths:
      - text/ucd/**
      - toolchains.lock.json
      - .github/workflows/text-ucd.yml
  workflow_dispatch:
  schedule:
    - cron: '10 5 * * 1'
permissions:
  contents: read
concurrency:
  group: text-ucd-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  unicode:
    name: Unicode properties, algorithms and dictionaries
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: rm -rf build/llvm build/cache && silk test --release --manifest-path text/ucd/silk.toml --root src/tests.silk
      - run: rm -rf build/llvm build/cache && silk test --release --manifest-path text/ucd/dictionary/silk.toml --root src/tests.silk
      - run: rm -rf build/llvm build/cache && silk build --release --manifest-path text/ucd/bench/silk.toml
      - run: build/llvm/x86_64-unknown-linux-gnu/release/ucd_bench --version

  conformance:
    name: Unicode 18 ${{ matrix.suite }} conformance
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [bidi, line_break, segmentation, normalization]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: text/ucd/scripts/fetch-unicode
      - run: rm -rf build/llvm build/cache && silk test --release --manifest-path text/ucd/silk.toml --root src/${{ matrix.suite }}_conformance.silk

  baseline:
    name: Full Unicode property equivalence and sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-silk
      - run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config
      - run: font/scripts/check-unicode-equivalence
      - run: rm -rf build/llvm build/cache && silk test --release --manifest-path text/ucd/silk.toml --root src/sweep.silk
      - run: text/ucd/scripts/check-normalization-gap
      - run: text/ucd/scripts/check-unicode-itemization
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unicode-normalization-gap
          path: build/normalization-gap.json

  performance:
    name: Unicode algorithm performance references
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: |
          cargo fmt --manifest-path text/ucd/scripts/rust-ucd-bench/Cargo.toml --check
          cargo clippy --locked --release --manifest-path text/ucd/scripts/rust-ucd-bench/Cargo.toml --target-dir build/ucd-rust -- -D warnings
          cargo build --locked --release --manifest-path text/ucd/scripts/rust-ucd-bench/Cargo.toml --target-dir build/ucd-rust
          rm -rf build/llvm build/cache
          silk build --release --manifest-path text/ucd/bench/silk.toml
      - run: text/ucd/scripts/bench-unicode --report build/ucd-bench/time.json
      - if: ${{ !cancelled() }}
        run: text/ucd/scripts/bench-unicode --callgrind --iterations 1 --samples 1 --report build/ucd-bench/instructions.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unicode-performance
          path: build/ucd-bench/
