name: CRDT
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: CRDT-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    # Windows intentionally excluded until silk-lang/silk#2769 and SQLite-store setup.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path crdt/btree/silk.toml
      - run: silk format --check --manifest-path crdt/core/silk.toml
      - run: silk format --check --manifest-path crdt/sync/silk.toml
      - run: silk format --check --manifest-path crdt/store-sqlite/silk.toml
      - run: silk format --check --manifest-path crdt/server/silk.toml
      - run: silk format --check --manifest-path examples/crdt-demo/silk.toml
      - run: silk format --check --manifest-path examples/crdt-demo/tests/silk.toml
      - run: silk format --check --manifest-path examples/crdt-demo/app/silk.toml
      - run: silk format --check --manifest-path crdt/bench/silk.toml
      - run: silk format --check --manifest-path examples/crdt-showcase/silk.toml
      - run: silk format --check --manifest-path examples/crdt-showcase/record/silk.toml
      - run: silk test --manifest-path crdt/btree/silk.toml --root src/tests.silk
      - run: silk test --manifest-path crdt/core/silk.toml --root src/tests.silk
      - run: silk test --manifest-path crdt/sync/silk.toml --root src/tests.silk
      - run: silk test --manifest-path crdt/store-sqlite/silk.toml --root src/tests.silk
      - run: silk test --manifest-path examples/crdt-demo/tests/silk.toml --root src/tests.silk
      - run: silk build --manifest-path crdt/server/silk.toml
      - run: silk check --manifest-path examples/crdt-demo/app/silk.toml
      - run: silk run --manifest-path crdt/bench/silk.toml -- 2000
      - name: Scripted CRDT showcase CPU frames
        run: node examples/crdt-showcase/scripts/record --frames-only --fps 2 --seconds 3 --scale 1 --debug
  macos:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - run: silk test --manifest-path crdt/core/silk.toml --root src/tests.silk
      - run: silk test --manifest-path crdt/store-sqlite/silk.toml --root src/tests.silk
      - run: silk test --manifest-path crdt/sync/silk.toml --root src/tests.silk
      - run: silk build --manifest-path crdt/server/silk.toml
