name: crdt
on:
  pull_request:
    paths:
      - crdt/**
      - db/sqlite/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/crdt.yml
  push:
    branches: [main]
    paths:
      - crdt/**
      - toolchains.lock.json
      - .github/workflows/crdt.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crdt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux CRDT tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path crdt/btree/silk.toml
      - run: silk test --manifest-path crdt/btree/silk.toml --root src/tests.silk
      - run: silk format --check --manifest-path crdt/core/silk.toml
      - run: silk test --manifest-path crdt/core/silk.toml --root src/tests.silk
      - run: silk format --check --manifest-path crdt/sync/silk.toml
      - run: silk test --manifest-path crdt/sync/silk.toml --root src/tests.silk
      - run: silk format --check --manifest-path crdt/store-sqlite/silk.toml
      - run: silk test --manifest-path crdt/store-sqlite/silk.toml --root src/tests.silk
  macos:
    name: macOS arm64 CRDT tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/llvm
            .cache/downloads
          key: crdt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json') }}
      - name: Install the pinned Silk compiler and LLVM 22
        run: |
          set -euo pipefail
          python3 scripts/install-silk >> "$GITHUB_PATH"
          echo "SILK_CLANG=$(python3 scripts/install-llvm)" >> "$GITHUB_ENV"
          rm -f .cache/downloads/LLVM-*.tar.xz
      - run: silk test --manifest-path crdt/core/silk.toml --root src/tests.silk
      - run: silk test --manifest-path crdt/store-sqlite/silk.toml --root src/tests.silk
