name: graphics-ui-renderer
on:
  pull_request:
    paths:
      - graphics/ui_renderer/**
      - graphics/ui_scene/**
      - graphics/gpu_scene/**
      - graphics/vector/**
      - graphics/atlas/**
      - gpu/webgpu/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/workflows/graphics-ui-renderer.yml
  push:
    branches: [main]
    paths:
      - graphics/ui_renderer/**
      - graphics/ui_scene/**
      - graphics/gpu_scene/**
      - graphics/vector/**
      - graphics/atlas/**
      - gpu/webgpu/**
      - toolchains.lock.json
      - .github/workflows/graphics-ui-renderer.yml
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 3'
permissions:
  contents: read
concurrency:
  group: graphics-ui-renderer-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  native:
    name: Packages, wasm32 check and GPU against the CPU reference on lavapipe
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            ~/.silk/archives
            .cache/llvm
            .cache/downloads
          key: ui-renderer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json') }}
      - name: Pin lavapipe and validate preinstalled LLVM22
        run: python3 gpu/webgpu/scripts/setup-ci
      - name: Shaders, packages and the GPU comparison
        run: python3 graphics/ui_renderer/scripts/check
      - name: Shared texture import (Vulkan opaque fd on lavapipe)
        run: |
          sudo apt-get install --yes --no-install-recommends libvulkan-dev
          python3 graphics/ui_renderer/scripts/test-shared-texture --require
  macos:
    name: Shared texture import and surface sprites on Metal (IOSurface)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            ~/.silk/archives
            .cache/llvm
            .cache/downloads
          key: ui-renderer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json') }}
      - name: Install the pinned Silk compiler and LLVM 22
        run: |
          set -euo pipefail
          python3 scripts/install-silk >> "$GITHUB_PATH"
          echo "SILK_CLANG=$(python3 scripts/install-llvm)" >> "$GITHUB_ENV"
          rm -f .cache/downloads/LLVM-*.tar.xz
      - name: IOSurface drawn through surface sprites against the CPU reference
        run: python3 graphics/ui_renderer/scripts/test-shared-texture --require
  browser:
    name: The same fixtures on navigator.gpu in installed Chromium
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/llvm
            .cache/playwright
            .cache/downloads
          key: ui-renderer-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json', 'gpu/webgpu/scripts/schema-lock.json') }}
      - name: Validate existing Chromium and install pinned Playwright JavaScript only
        run: python3 gpu/webgpu/scripts/setup-ci --browser
      - name: Browser comparison
        run: python3 graphics/ui_renderer/scripts/test-browser
  benchmark:
    name: Dense-scene frame time on lavapipe
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            ~/.silk/archives
            .cache/llvm
            .cache/downloads
          key: ui-renderer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json') }}
      - name: Pin lavapipe and validate preinstalled LLVM22
        run: python3 gpu/webgpu/scripts/setup-ci
      - name: Time the dense scene against the recorded budget
        run: |
          set -o pipefail
          mkdir -p graphics/ui_renderer/.cache
          python3 graphics/ui_renderer/scripts/bench | tee graphics/ui_renderer/.cache/bench.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ui-renderer-bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: graphics/ui_renderer/.cache/bench.txt
          if-no-files-found: warn
          retention-days: 30
