name: metal
on:
  pull_request:
    paths:
      - gpu/metal/**
      - silk.toml
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/metal.yml
  push:
    branches: [main]
    paths:
      - gpu/metal/**
      - toolchains.lock.json
      - .github/workflows/metal.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  types:
    name: Type-check for Apple targets
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - name: Library and examples
        run: |
          set -euo pipefail
          for package in gpu/metal gpu/metal/examples/compute gpu/metal/examples/headless-render; do
            (cd "$package" && silkc check --target aarch64-apple-darwin)
          done
      - name: Upstream declaration inventory
        run: python3 gpu/metal/tools/coverage.py
  macos:
    name: macOS arm64 Metal
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/llvm
            .cache/downloads
          key: metal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json') }}
      - name: Install the pinned Silk compiler and LLVM 22
        run: |
          set -euo pipefail
          python3 scripts/install-silk >> "$GITHUB_PATH"
          echo "SILK_CLANG=$(python3 scripts/install-llvm)" >> "$GITHUB_ENV"
          rm -f .cache/downloads/LLVM-*.tar.xz
      - name: Bridge, type-check and GPU examples
        working-directory: gpu/metal
        run: make check smoke
