name: images-svg-vector
on:
  pull_request:
    paths:
      - images/svg/vector/**
      - images/svg/gpu_scene/**
      - images/svg/scripts/**
      - gpu/webgpu/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/workflows/svg-vector.yml
  push:
    branches: [main]
    paths:
      - images/svg/vector/**
      - images/svg/gpu_scene/**
      - gpu/webgpu/**
      - toolchains.lock.json
      - .github/workflows/svg-vector.yml
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 2'
permissions:
  contents: read
concurrency:
  group: svg-vector-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  check:
    name: vector tests and gpu_scene CPU/GPU equality on lavapipe
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            .cache/llvm
            .cache/downloads
          key: svg-vector-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json') }}
      - name: Pin lavapipe and validate preinstalled LLVM22
        run: python3 gpu/webgpu/scripts/setup-ci
      - name: Packages, vector tests and scene equality
        run: python3 images/svg/scripts/check-vector
  benchmarks:
    name: vector against tiny-skia and resvg
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            .cache/llvm
            .cache/downloads
          key: svg-vector-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json') }}
      - name: Pin lavapipe and validate preinstalled LLVM22
        run: python3 gpu/webgpu/scripts/setup-ci
      - name: Time vector against tiny-skia and compare their images
        run: |
          set -o pipefail
          mkdir -p images/svg/.cache/bench
          python3 images/svg/scripts/bench-vector | tee images/svg/.cache/bench/vector.txt
      - name: Time vector.filter against resvg and compare their images
        run: |
          set -o pipefail
          python3 images/svg/scripts/bench-filters | tee images/svg/.cache/bench/filters.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: svg-vector-bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: images/svg/.cache/bench/*.txt
          if-no-files-found: warn
          retention-days: 30
