name: css-layout
on:
  pull_request:
    paths:
      - css/layout/**
      - silk.toml
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/css-layout.yml
  push:
    branches: [main]
    paths:
      - css/layout/**
      - toolchains.lock.json
      - .github/workflows/css-layout.yml
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
concurrency:
  group: css-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native checks, tests and adapter scenarios
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: css/layout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-silk
      - name: Native checks, tests and adapter scenarios
        run: scripts/check
      - name: Browser differential and seeded fuzz
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p .cache
          node scripts/chrome-diff.mjs --cli ../../build/llvm/x86_64-unknown-linux-gnu/debug/css-layout-cli --fuzz 200 --seed "$GITHUB_RUN_NUMBER" > .cache/differential.json
      - name: Benchmark observations
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !cancelled()
        run: python3 scripts/bench.py --cli ../../build/llvm/x86_64-unknown-linux-gnu/debug/css-layout-cli
      - uses: actions/upload-artifact@v4
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: differential-failures
          path: |
            css/layout/.cache/differential.json
            css/layout/.cache/chrome-diff/
          retention-days: 7
