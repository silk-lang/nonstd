name: Notes
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: Notes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  notes:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path examples/notes/silk.toml
      - run: silk format --check --manifest-path examples/notes/tests/silk.toml
      - run: silk format --check --manifest-path examples/notes/app/silk.toml
      - run: silk test --manifest-path examples/notes/tests/silk.toml --root src/tests.silk
      - name: Describe and PNG goldens
        run: silk run --manifest-path examples/notes/tests/silk.toml -- examples/notes/tests/goldens
      - run: silk check --manifest-path examples/notes/silk.toml --target wasm32-unknown-unknown
  window:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
        with:
          native-options: --linux-gpu
      - name: X11 and Wayland click and tab GPU comparisons
        run: node examples/notes/scripts/notes check --backend all --release
      - name: Inspector styles, events, persistence and screenshots
        env:
          SILK_WINDOW_BACKEND: x11
        run: xvfb-run -a node examples/notes/scripts/devtools-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-devtools-screenshots
          path: .cache/ui-devtools/*.png
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
        with:
          native-options: --browser
      - name: Reference, typing, scrolling and localStorage reload
        run: node examples/browser test examples/notes/browser -- --size 900,600 --click 120,90 --type "Hello from the browser" --stored notes
