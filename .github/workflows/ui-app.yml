name: ui-app
on:
  pull_request:
    paths:
      - ui/app/**
      - ui/tree/core/src/**
      - ui/inspect/core/src/**
      - ui/inspect/server/**
      - ui/tree/window/core/src/**
      - ui/tree/window/demo/**
      - graphics/editor/**
      - ui/tree/fixtures/**
      - ui/text/core/src/**
      - fonts/collection/**
      - fonts/raster/**
      - css/layout/core/src/**
      - graphics/ui_scene/**
      - graphics/ui_renderer/core/src/**
      - ui/sprites/**
      - graphics/atlas/**
      - graphics/vector/core/src/**
      - ui/assets/assets/**
      - ui/assets/src/generated_assets.silk
      - examples/graphics-demo/host/**
      - examples/graphics-demo/core/src/compare.silk
      - native/gpu/webgpu/core/scripts/**
      - native/platform/window/core/src/**
      - native/platform/window/core/native/**
      - silk.toml
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/ui-app.yml
  push:
    branches: [main]
    paths:
      - ui/app/**
      - ui/tree/core/src/**
      - ui/tree/window/demo/**
      - graphics/editor/**
      - ui/inspect/core/src/**
      - ui/inspect/server/**
      - toolchains.lock.json
      - .github/workflows/ui-app.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    name: Runtime tests, describe and PNG goldens, wasm32 check
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path ui/app/core/silk.toml
      - run: silk format --check --manifest-path ui/app/examples/silk.toml
      - run: silk format --check --manifest-path ui/app/tests/silk.toml
      - run: silk format --check --manifest-path ui/app/window/core/silk.toml
      - run: silk format --check --manifest-path ui/app/demo/silk.toml
      - run: silk test --manifest-path ui/app/tests/silk.toml --root src/tests.silk
      - run: silk build --manifest-path ui/app/tests/silk.toml
      - name: Example apps against the describe and PNG goldens
        run: build/llvm/x86_64-unknown-linux-gnu/debug/ui-app-tests ui/app/tests/goldens
      - run: silk check --manifest-path ui/app/core/silk.toml --target wasm32-unknown-unknown
      - run: silk check --manifest-path ui/app/examples/silk.toml --target wasm32-unknown-unknown
      - name: Retained document library tests
        run: silk test --manifest-path graphics/editor/silk.toml --root src/tests.silk
  window:
    name: The todo app in X11 and Wayland windows on lavapipe against the CPU reference
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            .cache/llvm
            .cache/downloads
          key: ui-app-window-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'native/gpu/webgpu/core/scripts/ci-lock.json') }}
      - name: Pin lavapipe and validate preinstalled LLVM22
        run: python3 native/gpu/webgpu/core/scripts/setup-ci
      - name: Install X11, Wayland, Xvfb and Weston
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols xvfb weston
      - name: A scripted click and Tab through the app in a window, read back and compared
        run: python3 ui/app/demo/scripts/demo check --backend all --release
      - name: Scroll demo inspector discovery and input
        env:
          SILK_WINDOW_BACKEND: x11
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: xvfb-run -a python3 examples/scroll-demo/scripts/inspect-check
      - name: Direct tree host input and GPU comparison
        env:
          SILK_WINDOW_BACKEND: x11
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: xvfb-run -a python3 ui/tree/window/demo/run --debug --check
