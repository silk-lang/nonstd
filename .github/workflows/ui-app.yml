name: Scroll Lab
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: Scroll Lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspector:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
        with:
          native-options: --linux-gpu
      - name: Scroll demo inspector discovery and input
        env:
          SILK_WINDOW_BACKEND: x11
        run: xvfb-run -a node examples/scroll-demo/scripts/inspect-check
  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
        with:
          native-options: --browser
      - name: Browser reference, pointer, click and wheel checks
        run: node examples/browser test examples/scroll-demo/wasm -- --size 1280,900 --click 640,450
