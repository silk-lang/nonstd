name: text-xml
on:
  pull_request:
    paths:
      - text/xml/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/text-xml.yml
  push:
    branches: [main]
    paths:
      - text/xml/**
      - toolchains.lock.json
      - .github/workflows/text-xml.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: text-xml-${{ github.ref }}
  cancel-in-progress: true
jobs:
  xml:
    name: Unit tests and the W3C XML conformance suite
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - uses: actions/cache@v4
        with:
          path: build/xmlconf
          key: xmlconf-20130923
      - run: silk format --check --manifest-path text/xml/silk.toml
      - run: silk test --manifest-path text/xml/silk.toml --root src/tests.silk
      - run: text/xml/scripts/check-xmlconf
