name: Repository layout
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Every package is a workspace member
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys, tomllib
          members = set(tomllib.loads(pathlib.Path("silk.toml").read_text())["workspace"]["members"])
          members |= set(tomllib.loads(pathlib.Path("layers.toml").read_text()).get("excluded", {}))
          found = {str(p.parent) for p in map(pathlib.Path, subprocess.check_output(
              ["git", "ls-files", "*silk.toml"], text=True).split()) if str(p) != "silk.toml"}
          missing = sorted(found - members)
          for path in missing:
              print(f"{path}/silk.toml is neither a root workspace member nor listed under [excluded] in layers.toml")
          sys.exit(1 if missing else 0)
          PY
      - name: README package index is current
        run: python3 scripts/readme-index --check
      - name: Dependency layers (report only until the moves land)
        run: python3 scripts/check-layers --report-only
