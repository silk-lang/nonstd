name: Workspace
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: Workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - run: node scripts/check-layers
      - run: node scripts/readme-index --check
      - run: node --test scripts/tests/*.test.mjs
      - run: node scripts/check-format.mjs
      - run: silk build --workspace
      - run: node scripts/check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-tests
          path: build/test-results
