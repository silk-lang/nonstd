name: Studio
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: Studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  studio:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path examples/studio/silk.toml
      - run: silk format --check --manifest-path examples/studio/app/silk.toml
      - run: silk format --check --manifest-path examples/studio/tests/silk.toml
      - run: node examples/studio/scripts/test --release
  window:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
        with:
          native-options: --linux-gpu
      - name: Rectangle click and Tab against CPU reference in X11 and Wayland
        run: node examples/studio/scripts/studio check --backend all --release
  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
        with:
          native-options: --browser
      - name: Reference, Rectangle click, wheel and localStorage reload
        run: node examples/browser test examples/studio/browser -- --size 1280,800 --click 603,723 --stored studio
