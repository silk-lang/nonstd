name: studio
on:
  pull_request:
    paths:
      - examples/studio/**
      - graphics/editor/src/**
      - graphics/codec/src/**
      - ui/components/src/**
      - ui/app/src/**
      - ui/app/window/**
      - ui/tree/src/**
      - ui/inspect/server/**
      - ui/tree/window/src/**
      - ui/tree/fixtures/**
      - ui/text/src/**
      - fonts/collection/**
      - fonts/raster/**
      - css/layout/src/**
      - graphics/ui_scene/**
      - graphics/ui_renderer/src/**
      - graphics/atlas/**
      - graphics/vector/src/**
      - native/gpu/webgpu/scripts/**
      - native/platform/window/src/**
      - native/platform/window/native/**
      - silk.toml
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/studio.yml
  push:
    branches: [main]
    paths:
      - examples/studio/**
      - graphics/editor/src/**
      - ui/app/window/**
      - ui/tree/window/src/**
      - toolchains.lock.json
      - .github/workflows/studio.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Studio editing, export and 100k workload contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path examples/studio/silk.toml
      - run: silk format --check --manifest-path examples/studio/app/silk.toml
      - run: silk format --check --manifest-path examples/studio/tests/silk.toml
      - run: python3 examples/studio/scripts/test --release
  window:
    name: Studio in X11 and Wayland windows on lavapipe against the CPU reference
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            .cache/llvm
            .cache/downloads
          key: studio-window-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'native/gpu/webgpu/scripts/ci-lock.json') }}
      - name: Pin lavapipe and validate preinstalled LLVM22
        run: python3 native/gpu/webgpu/scripts/setup-ci
      - name: Install X11, Wayland, Xvfb and Weston
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols xvfb weston
      - name: A scripted click on Rectangle and a Tab in a window, read back and compared
        run: python3 examples/studio/scripts/studio check --backend all --release
