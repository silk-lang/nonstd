# Budget: 15 minutes wall clock, worst case, cold caches.
name: images-svg
on:
  pull_request:
    paths:
      - images/svg/**
      - text/xml/**
      - css/style/**
      - font/**
      - text/ucd/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/svg.yml
  push:
    branches: [main]
    paths:
      - images/svg/**
      - text/xml/**
      - css/style/**
      - font/**
      - text/ucd/**
      - toolchains.lock.json
      - .github/workflows/svg.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: images-svg-${{ github.ref }}
  cancel-in-progress: true
jobs:
  freshness:
    name: SVG generated-file freshness
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: ./.github/actions/setup-silk
      - uses: actions/cache@v4
        with:
          path: |
            css/style/.cache/encodings
            images/svg/.cache/idna
          key: svg-generated-inputs-${{ hashFiles('css/style/encodings.lock.json', 'images/svg/idna.lock.json') }}
      - name: Hydrate pinned SVG generation inputs
        run: |
          images/svg/scripts/generate-encodings --fetch
          images/svg/scripts/generate-idna --fetch
      - name: Generated and formatted files are committed
        run: font/scripts/generate --check

  svg:
    name: SVG rendering and conformance tooling
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - name: Install native SVG serif font
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: images/svg/scripts/requirements.txt
      - run: python3 -m pip install -r images/svg/scripts/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            images/svg/.cache/specs
            images/svg/tests/.cache/suites
          key: svg-references-${{ hashFiles('images/svg/specs.lock.json', 'images/svg/tests/suites.lock.json') }}
      - uses: actions/cache@v4
        with:
          path: |
            css/style/.cache/encodings
            images/svg/.cache/idna
          key: svg-generated-inputs-${{ hashFiles('css/style/encodings.lock.json', 'images/svg/idna.lock.json') }}
      - name: Hydrate pinned SVG generation inputs
        run: |
          images/svg/scripts/generate-encodings --fetch
          images/svg/scripts/generate-idna --fetch
      - run: images/svg/scripts/check
      - name: Upload SVG reference diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svg-reference-diagnostics
          path: build/svg/
          if-no-files-found: ignore
