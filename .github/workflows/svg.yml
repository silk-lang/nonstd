# Budget: 15 minutes wall clock, worst case, cold caches.
name: svg
on:
  pull_request:
    paths:
      - svg/**
      - graphics/codec/**
      - graphics/vector/**
      - text/xml/**
      - css/style/**
      - font/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/svg.yml
  push:
    branches: [main]
    paths:
      - svg/**
      - graphics/codec/**
      - graphics/vector/**
      - text/xml/**
      - css/style/**
      - font/**
      - toolchains.lock.json
      - .github/workflows/svg.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: svg-${{ github.ref }}
  cancel-in-progress: true
jobs:
  freshness:
    name: SVG generated-file freshness
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: ./.github/actions/setup-silk
      - uses: actions/cache@v4
        with:
          path: |
            css/style/.cache/encodings
            svg/.cache/idna
            svg/.cache/casefold
          key: svg-generated-inputs-${{ hashFiles('css/style/encodings.lock.json', 'svg/core/idna.lock.json', 'svg/core/casefold.lock.json') }}
      - name: Hydrate pinned SVG generation inputs
        run: |
          svg/core/scripts/generate-encodings --fetch
          svg/core/scripts/generate-idna --fetch
          svg/core/scripts/generate-casefold --fetch
      - name: Generated and formatted files are committed
        run: fonts/scripts/generate --check

  svg:
    name: SVG rendering and conformance tooling
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - name: Install native SVG serif font
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: svg/core/scripts/requirements.txt
      - run: python3 -m pip install -r svg/core/scripts/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            svg/.cache/specs
            svg/tests/.cache/suites
          key: svg-references-${{ hashFiles('svg/core/specs.lock.json', 'svg/tests/suites.lock.json') }}
      - uses: actions/cache@v4
        with:
          path: |
            css/style/.cache/encodings
            svg/.cache/idna
            svg/.cache/casefold
          key: svg-generated-inputs-${{ hashFiles('css/style/encodings.lock.json', 'svg/core/idna.lock.json', 'svg/core/casefold.lock.json') }}
      - name: Hydrate pinned SVG generation inputs
        run: |
          svg/core/scripts/generate-encodings --fetch
          svg/core/scripts/generate-idna --fetch
          svg/core/scripts/generate-casefold --fetch
      - run: svg/core/scripts/check
      - name: Upload SVG reference diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svg-reference-diagnostics
          path: build/svg/
          if-no-files-found: ignore

  wasm:
    name: SVG WebAssembly build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - name: Install the native serif font and wasm-ld
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core lld
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the renderer for wasm32 and natively
        run: |
          PATH="$(dirname "$SILK_CLANG"):$PATH"
          svg/core/scripts/build-wasm
          silk build --release --manifest-path svg/tools/cli/silk.toml --target x86_64-unknown-linux-gnu
      - name: wasm32 renders the fixtures exactly as the native build
        run: >
          node svg/tools/wasm/js/compare.mjs
          build/llvm/wasm32-unknown-unknown/release/svg-wasm
          build/llvm/x86_64-unknown-linux-gnu/release/svg-cli
          svg/tests/fixtures/*/manifest.json
