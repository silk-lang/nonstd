name: Windows
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    # The pinned Dawn archive needs the Visual Studio 2026 C++ libraries.
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      SILK_HOME: ${{ github.workspace }}\.silk-home
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: |
            .cache/downloads
            .cache/silk
            .cache/llvm
            .cache/webgpu
            .cache/glfw
            .cache/dxc
            .cache/native-dawn
          key: windows-toolchains-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json') }}
      - name: Install pinned compiler and LLVM
        shell: pwsh
        run: |
          python scripts/install-silk >> $env:GITHUB_PATH
          $clang = python scripts/install-llvm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SILK_CLANG=$clang" >> $env:GITHUB_ENV
      - name: Wrap Dawn in a DLL and point Silk at it and GLFW
        run: python scripts/prepare-windows
      - name: Build every workspace package
        run: |
          silkc build --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python gpu/webgpu/scripts/window --build-only
      - name: Library unit tests
        run: python scripts/check
      - name: Installer and native CLI regressions
        run: |
          python -m unittest discover -s scripts/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-native-tools
      - name: Windows ABI and GPU scenarios
        run: |
          python gpu/webgpu/scripts/test-abi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python gpu/webgpu/scripts/test-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python gpu/webgpu/scripts/test-pixels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python images/svg/scripts/test-scene
      - name: XML conformance
        run: python text/xml/scripts/check-xmlconf
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tests
          path: build/test-results
