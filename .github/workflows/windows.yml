name: Windows
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: Windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  retained:
    # CRDT sync/store/server and CRDT apps stay excluded: silk-lang/silk#2769.
    runs-on: windows-2025-vs2026
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: ./.github/actions/setup-silk
      - run: pwsh -File scripts/prepare-windows.ps1
      - run: silk build --workspace
      - run: node scripts/check
      - run: node --test scripts/tests/*.test.mjs
      - name: Win32 graphics demo readback comparison
        run: node examples/graphics-demo/scripts/app check --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-tests
          path: build/test-results
