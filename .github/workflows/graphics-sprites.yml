name: graphics-sprites
on:
  pull_request:
    paths:
      - graphics/sprites/**
      - graphics/atlas/**
      - images/codec/**
      - images/svg/**
      - text/xml/**
      - css/style/**
      - font/**
      - graphics/vector/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/graphics-sprites.yml
  push:
    branches: [main]
    paths:
      - graphics/sprites/**
      - graphics/atlas/**
      - images/codec/**
      - images/svg/**
      - toolchains.lock.json
      - .github/workflows/graphics-sprites.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: graphics-sprites-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sprites:
    name: Icon and image tiles, native and wasm32 checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path graphics/sprites/silk.toml
      - run: silk test --manifest-path graphics/sprites/silk.toml --root src/tests.silk
      - run: silk check --manifest-path graphics/sprites/silk.toml --target wasm32-unknown-unknown
