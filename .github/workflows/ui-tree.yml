name: ui-tree
on:
  pull_request:
    paths:
      - ui/tree/**
      - ui/text/src/**
      - font/collection/**
      - font/raster/**
      - css/layout/src/**
      - graphics/ui_scene/**
      - graphics/ui_renderer/src/**
      - graphics/sprites/**
      - graphics/atlas/**
      - graphics/vector/src/**
      - graphics/demo/assets/**
      - graphics/demo/src/generated_assets.silk
      - gpu/webgpu/browser/**
      - silk.toml
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/ui-tree.yml
  push:
    branches: [main]
    paths:
      - ui/tree/**
      - ui/text/src/**
      - css/layout/src/**
      - graphics/ui_scene/**
      - toolchains.lock.json
      - .github/workflows/ui-tree.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-tree-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tree:
    name: Tree tests, CPU goldens and wasm32 check
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path ui/tree/silk.toml
      - run: silk format --check --manifest-path ui/tree/fixtures/silk.toml
      - run: silk format --check --manifest-path ui/tree/tests/silk.toml
      - run: silk test --manifest-path ui/tree/tests/silk.toml --root src/tests.silk
      - run: silk build --manifest-path ui/tree/tests/silk.toml
      - name: Card list and form against the PNG and describe goldens
        run: build/llvm/x86_64-unknown-linux-gnu/debug/ui-tree-tests ui/tree/tests/goldens
      - run: silk check --manifest-path ui/tree/silk.toml --target wasm32-unknown-unknown
  browser:
    name: The fixture trees on navigator.gpu in installed Chromium against the CPU reference
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/llvm
            .cache/playwright
            .cache/downloads
          key: ui-tree-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json', 'gpu/webgpu/scripts/schema-lock.json') }}
      - name: Validate existing Chromium and install pinned Playwright JavaScript only
        run: python3 gpu/webgpu/scripts/setup-ci --browser
      - name: Browser comparison
        run: python3 ui/tree/scripts/test-browser
