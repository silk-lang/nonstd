name: graphics-atlas
on:
  pull_request:
    paths:
      - graphics/atlas/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/graphics-atlas.yml
  push:
    branches: [main]
    paths:
      - graphics/atlas/**
      - toolchains.lock.json
      - .github/workflows/graphics-atlas.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: graphics-atlas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  atlas:
    name: Packing and eviction tests, native and wasm32 checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path graphics/atlas/silk.toml
      - run: silk test --manifest-path graphics/atlas/silk.toml --root src/tests.silk
      - run: silk check --manifest-path graphics/atlas/silk.toml --target wasm32-unknown-unknown
