name: Graphics demo
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: Graphics demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
        with:
          native-options: --linux-gpu
      - name: Generated modules, packages, goldens and GPU comparison
        run: node examples/graphics-demo/scripts/check
      - name: X11 and Wayland window readback
        run: node examples/graphics-demo/scripts/app check --backend all --release
  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
        with:
          native-options: --browser
      - name: Browser check and interaction
        run: node examples/graphics-demo/scripts/browser test
  macos:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - name: AppKit window readback on Metal
        run: node examples/graphics-demo/scripts/app check --release
