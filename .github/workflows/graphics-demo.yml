name: graphics-demo
on:
  pull_request:
    paths:
      - examples/graphics-demo/**
      - graphics/ui_renderer/**
      - graphics/ui_scene/**
      - ui/sprites/**
      - graphics/atlas/**
      - graphics/vector/**
      - fonts/raster/**
      - svg/**
      - native/platform/window/**
      - native/gpu/webgpu/**
      - silk.toml
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/workflows/graphics-demo.yml
  push:
    branches: [main]
    paths:
      - examples/graphics-demo/**
      - graphics/ui_renderer/**
      - graphics/ui_scene/**
      - ui/sprites/**
      - fonts/raster/**
      - native/platform/window/**
      - native/gpu/webgpu/**
      - toolchains.lock.json
      - .github/workflows/graphics-demo.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: graphics-demo-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  linux:
    name: Packages, goldens and GPU against the CPU reference, X11 and Wayland windows on lavapipe
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            .cache/llvm
            .cache/downloads
          key: graphics-demo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'native/gpu/webgpu/core/scripts/ci-lock.json') }}
      - name: Pin lavapipe and validate preinstalled LLVM22
        run: python3 native/gpu/webgpu/core/scripts/setup-ci
      - name: Install X11, Wayland, Xvfb and Weston
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols xvfb weston
      - name: Generated modules, packages, goldens and the GPU comparison
        run: python3 examples/graphics-demo/core/scripts/check
      - name: The demo in X11 and Wayland windows, read back and compared
        run: python3 examples/graphics-demo/core/scripts/app check --backend all --release
  browser:
    name: The demo on navigator.gpu in installed Chromium
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/llvm
            .cache/playwright
            .cache/downloads
          key: graphics-demo-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'native/gpu/webgpu/core/scripts/ci-lock.json', 'native/gpu/webgpu/core/scripts/schema-lock.json') }}
      - name: Validate existing Chromium and install pinned Playwright JavaScript only
        run: python3 native/gpu/webgpu/core/scripts/setup-ci --browser
      - name: Check run and interaction run in the browser
        run: python3 examples/graphics-demo/core/scripts/browser test
  macos:
    name: macOS arm64 AppKit window on Metal
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            .cache/llvm
            .cache/downloads
          key: graphics-demo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'native/gpu/webgpu/core/scripts/ci-lock.json') }}
      - name: Install the pinned Silk compiler and LLVM 22
        run: |
          set -euo pipefail
          python3 scripts/install-silk >> "$GITHUB_PATH"
          echo "SILK_CLANG=$(python3 scripts/install-llvm)" >> "$GITHUB_ENV"
          rm -f .cache/downloads/LLVM-*.tar.xz
      - name: The demo in a window, read back and compared
        run: python3 examples/graphics-demo/core/scripts/app check --release
  windows:
    name: Windows Win32 window on D3D12
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      SILK_HOME: ${{ github.workspace }}\.silk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            .cache/llvm
            .cache/downloads
            .cache/dxc
          key: graphics-demo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json') }}
      - name: Install the pinned Silk compiler and LLVM 22
        shell: pwsh
        run: |
          python scripts/install-silk >> $env:GITHUB_PATH
          $clang = python scripts/install-llvm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SILK_CLANG=$clang" >> $env:GITHUB_ENV
      - name: Wrap Dawn in a DLL, build the Win32 bridge and point Silk at them
        run: python scripts/prepare-windows
      - name: The demo in a window, read back and compared
        run: python examples/graphics-demo/core/scripts/app check --release
