name: platform-window
on:
  pull_request:
    paths:
      - native/platform/window/**
      - silk.toml
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/platform-window.yml
  push:
    branches: [main]
    paths:
      - native/platform/window/**
      - toolchains.lock.json
      - .github/workflows/platform-window.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-window-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Unit tests and Apple type-checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - name: Generated key tables and bridge declarations are current
        run: |
          set -euo pipefail
          python3 native/platform/window/scripts/generate-keys --check
          python3 native/platform/window/scripts/generate-bridge --check
      - name: Formatting
        run: |
          set -euo pipefail
          for package in native/platform/window native/platform/window/tests/macos native/platform/window/examples/demo \
            native/platform/window/tests/smoke native/platform/window/tests/linux native/platform/window/tests/windows \
            native/platform/window/tests/browser; do
            (cd "$package" && silkc format --check)
          done
      - name: Install the Linux bridge's X11 and Wayland development packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev libwayland-dev
      - name: Unit tests (headless backend)
        working-directory: native/platform/window
        run: silkc test --root src/tests.silk
      - name: Type-check for every target
        run: |
          set -euo pipefail
          (cd native/platform/window && silkc check)
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            for package in native/platform/window native/platform/window/tests/macos native/platform/window/examples/demo; do
              (cd "$package" && silkc check --target "$target")
            done
          done
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc wasm32-unknown-unknown; do
            (cd native/platform/window && silkc check --target "$target")
            (cd native/platform/window/tests/smoke && silkc check --target "$target")
          done
          (cd native/platform/window/tests/linux && silkc check --target x86_64-unknown-linux-gnu)
          (cd native/platform/window/tests/windows && silkc check --target x86_64-pc-windows-msvc)
          (cd native/platform/window/tests/browser && silkc check --target wasm32-unknown-unknown)
  linux-backends:
    name: Linux X11 and Wayland smoke tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - name: Install X11, Wayland, Xvfb and Weston
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols xvfb weston
      - name: Bridge and smoke tests under Xvfb and a headless Weston
        run: python3 native/platform/window/scripts/linux smoke --backend all
  windows:
    name: Windows Win32 smoke test
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      SILK_HOME: ${{ github.workspace }}\.silk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/llvm
            .cache/downloads
          key: platform-window-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json') }}
      - name: Install the pinned Silk compiler and LLVM 22
        shell: pwsh
        run: |
          python scripts/install-silk >> $env:GITHUB_PATH
          $clang = python scripts/install-llvm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SILK_CLANG=$clang" >> $env:GITHUB_ENV
      - name: Bridge and smoke test in a real window
        run: python native/platform/window/scripts/windows smoke
      - name: Smoke test with the message loop on the caller's stack
        env:
          SILK_WINDOW_FIBER: "0"
        run: python native/platform/window/scripts/windows smoke
  browser:
    name: Browser canvas smoke test in Chromium
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/llvm
            .cache/playwright
            .cache/downloads
          key: platform-window-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'native/gpu/webgpu/scripts/ci-lock.json') }}
      - name: Install the pinned Silk compiler and LLVM 22
        run: |
          set -euo pipefail
          python3 scripts/install-silk >> "$GITHUB_PATH"
          echo "SILK_CLANG=$(python3 scripts/install-llvm)" >> "$GITHUB_ENV"
      - name: Validate existing Chromium and install pinned Playwright JavaScript only
        run: python3 native/gpu/webgpu/scripts/setup-ci --browser
      - name: Browser backend smoke test
        run: python3 native/platform/window/scripts/browser smoke
  macos:
    name: macOS arm64 AppKit smoke test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/llvm
            .cache/downloads
          key: platform-window-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json') }}
      - name: Install the pinned Silk compiler and LLVM 22
        run: |
          set -euo pipefail
          python3 scripts/install-silk >> "$GITHUB_PATH"
          echo "SILK_CLANG=$(python3 scripts/install-llvm)" >> "$GITHUB_ENV"
          rm -f .cache/downloads/LLVM-*.tar.xz
      - name: Bridge and smoke test in a real window
        run: |
          set -euo pipefail
          python3 native/platform/window/scripts/macos smoke 2>&1 | tee smoke.log
          grep -q "AppKit runs on its own stack" smoke.log
      - name: Smoke test with AppKit on the caller's stack
        env:
          SILK_WINDOW_FIBER: "0"
        run: |
          set -euo pipefail
          python3 native/platform/window/scripts/macos smoke 2>&1 | tee smoke.log
          grep -q "AppKit runs on the caller's stack" smoke.log
      - name: Build the WebGPU demo
        run: python3 native/platform/window/scripts/macos demo --build-only
