name: platform-window
on:
  pull_request:
    paths:
      - platform/window/**
      - silk.toml
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/platform-window.yml
  push:
    branches: [main]
    paths:
      - platform/window/**
      - toolchains.lock.json
      - .github/workflows/platform-window.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-window-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Unit tests and Apple type-checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - name: Generated key tables and bridge declarations are current
        run: |
          set -euo pipefail
          python3 platform/window/scripts/generate-keys --check
          python3 platform/window/scripts/generate-bridge --check
      - name: Formatting
        run: |
          set -euo pipefail
          for package in platform/window platform/window/tests/macos platform/window/examples/demo \
            platform/window/tests/smoke platform/window/tests/linux platform/window/tests/windows; do
            (cd "$package" && silkc format --check)
          done
      - name: Unit tests (headless backend)
        working-directory: platform/window
        run: silkc test --root src/tests.silk
      - name: Type-check for every target
        run: |
          set -euo pipefail
          (cd platform/window && silkc check)
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            for package in platform/window platform/window/tests/macos platform/window/examples/demo; do
              (cd "$package" && silkc check --target "$target")
            done
          done
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc wasm32-unknown-unknown; do
            (cd platform/window && silkc check --target "$target")
            (cd platform/window/tests/smoke && silkc check --target "$target")
          done
          (cd platform/window/tests/linux && silkc check --target x86_64-unknown-linux-gnu)
          (cd platform/window/tests/windows && silkc check --target x86_64-pc-windows-msvc)
  linux-backends:
    name: Linux X11 and Wayland smoke tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-silk
      - name: Install X11, Wayland, Xvfb and Weston
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols xvfb weston
      - name: Bridge and smoke tests under Xvfb and a headless Weston
        run: python3 platform/window/scripts/linux smoke --backend all
  macos:
    name: macOS arm64 AppKit smoke test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/llvm
            .cache/downloads
          key: platform-window-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json') }}
      - name: Install the pinned Silk compiler and LLVM 22
        run: |
          set -euo pipefail
          python3 scripts/install-silk >> "$GITHUB_PATH"
          echo "SILK_CLANG=$(python3 scripts/install-llvm)" >> "$GITHUB_ENV"
          rm -f .cache/downloads/LLVM-*.tar.xz
      - name: Bridge and smoke test in a real window
        run: |
          set -euo pipefail
          python3 platform/window/scripts/macos smoke 2>&1 | tee smoke.log
          grep -q "AppKit runs on its own stack" smoke.log
      - name: Smoke test with AppKit on the caller's stack
        env:
          SILK_WINDOW_FIBER: "0"
        run: |
          set -euo pipefail
          python3 platform/window/scripts/macos smoke 2>&1 | tee smoke.log
          grep -q "AppKit runs on the caller's stack" smoke.log
      - name: Build the WebGPU demo
        run: python3 platform/window/scripts/macos demo --build-only
