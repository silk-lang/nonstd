name: ui-inspect
on:
  pull_request:
    paths:
      - ui/inspect/**
      - ui/tree/src/**
      - ui/tree/fixtures/**
      - ui/text/src/**
      - font/collection/**
      - font/raster/**
      - css/layout/src/**
      - graphics/ui_scene/**
      - graphics/sprites/**
      - graphics/atlas/**
      - graphics/vector/src/**
      - graphics/demo/assets/**
      - graphics/demo/src/generated_assets.silk
      - silk.toml
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/ui-inspect.yml
  push:
    branches: [main]
    paths:
      - ui/inspect/**
      - ui/tree/src/**
      - css/layout/src/**
      - graphics/ui_scene/**
      - toolchains.lock.json
      - .github/workflows/ui-inspect.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-inspect-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    name: Inspector tests, overlay and node view goldens, wasm32 check
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path ui/inspect/silk.toml
      - run: silk format --check --manifest-path ui/inspect/tests/silk.toml
      - run: silk test --manifest-path ui/inspect/tests/silk.toml --root src/tests.silk
      - run: silk build --manifest-path ui/inspect/tests/silk.toml
      - name: Highlight overlay and node view against the goldens
        run: build/llvm/x86_64-unknown-linux-gnu/debug/ui-inspect-tests ui/inspect/tests/goldens
      - run: silk check --manifest-path ui/inspect/silk.toml --target wasm32-unknown-unknown
