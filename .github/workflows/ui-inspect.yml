name: ui-inspect
on:
  pull_request:
    paths:
      - ui/inspect/**
      - ui/app/**
      - examples/notes/**
      - ui/components/core/src/**
      - ui/tree/core/src/**
      - ui/tree/fixtures/**
      - ui/text/core/src/**
      - fonts/collection/**
      - fonts/raster/**
      - css/layout/core/src/**
      - graphics/ui_scene/**
      - ui/sprites/**
      - graphics/atlas/**
      - graphics/vector/core/src/**
      - ui/assets/assets/**
      - ui/assets/src/generated_assets.silk
      - silk.toml
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - ui/tree/demo/**
      - ui/tree/window/**
      - native/platform/window/**
      - native/gpu/webgpu/**
      - graphics/ui_renderer/**
      - examples/graphics-demo/host/**
      - .github/workflows/ui-inspect.yml
  push:
    branches: [main]
    paths:
      - ui/inspect/**
      - ui/app/**
      - ui/tree/core/src/**
      - css/layout/core/src/**
      - graphics/ui_scene/**
      - toolchains.lock.json
      - .github/workflows/ui-inspect.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-inspect-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    name: Inspector tests, overlay and node view goldens, wasm32 check
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path ui/inspect/core/silk.toml
      - run: silk format --check --manifest-path ui/inspect/tests/silk.toml
      - run: silk test --manifest-path ui/inspect/tests/silk.toml --root src/tests.silk
      - run: silk build --manifest-path ui/inspect/tests/silk.toml
      - name: Highlight overlay and node view against the goldens
        run: build/llvm/x86_64-unknown-linux-gnu/debug/ui-inspect-tests ui/inspect/tests/goldens
      - run: silk check --manifest-path ui/inspect/core/silk.toml --target wasm32-unknown-unknown
      - run: silk format --check --manifest-path ui/inspect/server/core/silk.toml
      - run: silk format --check --manifest-path ui/inspect/server/tests/silk.toml
      - run: silk format --check --manifest-path ui/inspect/cli/silk.toml
      - name: Install headers for the native window-event adapter tests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev libwayland-dev
      - name: Protocol commands, and requests over a Unix socket
        run: silk test --manifest-path ui/inspect/server/tests/silk.toml --root src/tests.silk
      - run: silk build --manifest-path ui/inspect/cli/silk.toml
      - run: silk format --check --manifest-path ui/inspect/mcp/silk.toml
      - run: silk build --manifest-path ui/inspect/mcp/silk.toml
      - run: silk format --check --manifest-path ui/inspect/devtools/core/silk.toml
      - run: silk format --check --manifest-path ui/inspect/devtools/tests/silk.toml
      - run: silk format --check --manifest-path ui/inspect/devtools/app/silk.toml
      - name: The devtools inspect the todo app through the protocol
        run: silk test --manifest-path ui/inspect/devtools/tests/silk.toml --root src/tests.silk
      - run: silk build --manifest-path ui/inspect/devtools/tests/silk.toml
      - name: Devtools scenes against the describe and PNG goldens
        run: build/llvm/x86_64-unknown-linux-gnu/debug/ui-inspect-devtools-tests ui/inspect/devtools/tests/goldens
      - run: silk check --manifest-path ui/inspect/devtools/core/silk.toml --target wasm32-unknown-unknown
      - run: silk check --manifest-path ui/inspect/devtools/app/silk.toml
  demo:
    name: ui-inspect-cli, ui-inspect-mcp and the devtools window drive demos in X11 windows on lavapipe
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            .cache/llvm
            .cache/downloads
          key: ui-inspect-demo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'native/gpu/webgpu/core/scripts/ci-lock.json') }}
      - name: Pin lavapipe and validate preinstalled LLVM22
        run: python3 native/gpu/webgpu/core/scripts/setup-ci
      - name: Install X11, Wayland and Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev \
            libwayland-dev xvfb
      - name: Snapshot, click, wait, highlight, inspect and screenshot over the socket
        run: python3 ui/tree/demo/scripts/demo inspect
      - name: An MCP client finds and clicks a button by its label through ui-inspect-mcp
        run: python3 ui/tree/demo/scripts/demo mcp
      - name: The devtools window inspects the notes app, driven through its own inspector
        run: python3 ui/inspect/devtools/core/scripts/devtools check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspect-screenshot
          path: |
            .cache/ui-tree-demo/inspect.png
            .cache/ui-tree-demo/mcp.png
            .cache/ui-devtools/devtools.png
            .cache/ui-devtools/notes.png
          if-no-files-found: ignore
