name: terminal-ghostty
on:
  pull_request:
    paths:
      - native/terminal/ghostty/**
      - examples/terminal-demo/**
      - ui/app/**
      - ui/tree/**
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/terminal-ghostty.yml
  push:
    branches: [main]
    paths:
      - native/terminal/ghostty/**
      - examples/terminal-demo/**
      - toolchains.lock.json
      - .github/workflows/terminal-ghostty.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terminal-ghostty-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: Pinned VT library and native UI integration
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/llvm
            .cache/downloads
          key: terminal-ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json') }}
      - name: Install the pinned Silk compiler and LLVM 22
        run: |
          set -euo pipefail
          python3 scripts/install-silk >> "$GITHUB_PATH"
          echo "SILK_CLANG=$(python3 scripts/install-llvm)" >> "$GITHUB_ENV"
      - run: python3 native/terminal/ghostty/scripts/prepare
      - run: silk format --check --manifest-path native/terminal/ghostty/silk.toml
      - run: silk format --check --manifest-path examples/terminal-demo/silk.toml
      - run: silk test --manifest-path native/terminal/ghostty/silk.toml --root src/tests.silk
      - run: silk test --manifest-path examples/terminal-demo/silk.toml --root src/tests.silk
      - name: Verify PTY shutdown and child reaping
        run: |
          mkdir -p examples/terminal-demo/build
          "$SILK_CLANG" -isysroot "$(xcrun --show-sdk-path)" -std=c11 -Wall -Wextra -Werror \
            examples/terminal-demo/native/pty_tests.c -o examples/terminal-demo/build/pty-tests
          examples/terminal-demo/build/pty-tests
      - run: silk build --manifest-path examples/terminal-demo/silk.toml
