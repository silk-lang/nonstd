name: ui-components
on:
  pull_request:
    paths:
      - ui/components/**
      - ui/app/src/**
      - ui/app/window/**
      - ui/tree/src/**
      - ui/inspect/src/**
      - ui/inspect/server/**
      - ui/tree/window/src/**
      - ui/tree/fixtures/**
      - ui/text/src/**
      - font/collection/**
      - font/raster/**
      - css/layout/src/**
      - graphics/ui_scene/**
      - graphics/ui_renderer/src/**
      - ui/sprites/**
      - graphics/atlas/**
      - graphics/vector/src/**
      - graphics/demo/assets/**
      - graphics/demo/src/generated_assets.silk
      - graphics/demo/host/**
      - graphics/demo/src/compare.silk
      - gpu/webgpu/scripts/**
      - platform/window/src/**
      - platform/window/native/**
      - silk.toml
      - toolchains.lock.json
      - scripts/install-*
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/ui-components.yml
  push:
    branches: [main]
    paths:
      - ui/components/**
      - ui/app/src/**
      - ui/tree/src/**
      - toolchains.lock.json
      - .github/workflows/ui-components.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-components-${{ github.ref }}
  cancel-in-progress: true
jobs:
  components:
    name: Component tests, keyboard-only test, describe and PNG goldens, wasm32 check
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-silk
      - run: silk format --check --manifest-path ui/components/silk.toml
      - run: silk format --check --manifest-path ui/components/gallery/silk.toml
      - run: silk format --check --manifest-path ui/components/tests/silk.toml
      - run: silk format --check --manifest-path ui/components/demo/silk.toml
      - run: silk test --manifest-path ui/components/tests/silk.toml --root src/tests.silk
      - run: silk build --manifest-path ui/components/tests/silk.toml
      - name: The gallery against the describe and PNG goldens
        run: build/llvm/x86_64-unknown-linux-gnu/debug/ui-components-tests ui/components/tests/goldens
      - run: silk check --manifest-path ui/components/silk.toml --target wasm32-unknown-unknown
      - run: silk check --manifest-path ui/components/gallery/silk.toml --target wasm32-unknown-unknown
  window:
    name: The gallery in X11 and Wayland windows on lavapipe against the CPU reference
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            .cache/llvm
            .cache/downloads
          key: ui-components-window-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json') }}
      - name: Pin lavapipe and validate preinstalled LLVM22
        run: python3 gpu/webgpu/scripts/setup-ci
      - name: Install X11, Wayland, Xvfb and Weston
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols xvfb weston
      - name: A scripted click and Tab through the gallery in a window, read back and compared
        run: python3 ui/components/demo/scripts/demo check --backend all --release
