name: platform-webview-chromium
on:
  pull_request:
    paths:
      - platform/webview/**
      - platform/window/native/linux/**
      - platform/window/src/bridge*.silk
      - graphics/ui_renderer/src/**
      - gpu/webgpu/**
      - toolchains.lock.json
      - scripts/install-cef
      - scripts/_install.py
      - .github/actions/setup-silk/**
      - .github/workflows/platform-webview-chromium.yml
  push:
    branches: [main]
    paths:
      - platform/webview/**
      - toolchains.lock.json
      - scripts/install-cef
      - .github/workflows/platform-webview-chromium.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-webview-chromium-${{ github.ref }}
  cancel-in-progress: true
jobs:
  latest:
    name: Newest stable CEF (for bumping the pin)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pinned CEF and the newest stable build
        run: |
          set -euo pipefail
          python3 -c "import json; print('pinned:', json.load(open('toolchains.lock.json'))['cef']['version'])"
          python3 scripts/install-cef --latest
  linux:
    name: Bridge, unit tests and the smoke test under Xvfb (CPU frames, lavapipe)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            .cache/llvm
            .cache/downloads
          key: webview-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json') }}
      - name: Pin lavapipe and validate preinstalled LLVM22
        run: python3 gpu/webgpu/scripts/setup-ci
      - name: Install X11, Wayland, Xvfb, Weston and the libraries libcef.so loads
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols xvfb weston \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxshmfence1 libpango-1.0-0 \
            libcairo2 libasound2t64 libdbus-1-3 libglib2.0-0t64 libx11-xcb1 libxext6 libexpat1
          echo "$(python3 scripts/install-silk)" >> "$GITHUB_PATH"
      - name: Install the pinned CEF
        run: python3 scripts/install-cef
      - name: The key table is current
        run: python3 platform/webview/chromium/scripts/generate-keys --check
      - name: Formatting
        run: |
          set -euo pipefail
          for package in platform/webview/chromium platform/webview/chromium/tests/smoke; do
            (cd "$package" && silkc format --check)
          done
      - name: Unit tests
        working-directory: platform/webview/chromium
        run: silkc test --root src/tests.silk
      - name: Smoke test under Xvfb
        run: python3 platform/webview/chromium/scripts/linux smoke --backend x11
