name: platform-webview-chromium
on:
  pull_request:
    paths:
      - platform/webview/**
      - ui/webview/**
      - ui/app/window/**
      - platform/window/native/linux/**
      - platform/window/src/bridge*.silk
      - graphics/ui_renderer/src/**
      - gpu/webgpu/**
      - toolchains.lock.json
      - scripts/install-cef
      - scripts/_install.py
      - scripts/prepare-windows
      - .github/actions/setup-silk/**
      - .github/workflows/platform-webview-chromium.yml
  push:
    branches: [main]
    paths:
      - platform/webview/**
      - ui/webview/**
      - toolchains.lock.json
      - scripts/install-cef
      - .github/workflows/platform-webview-chromium.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-webview-chromium-${{ github.ref }}
  cancel-in-progress: true
jobs:
  latest:
    name: Newest stable CEF (for bumping the pin)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pinned CEF and the newest stable build
        run: |
          set -euo pipefail
          python3 -c "import json; print('pinned:', json.load(open('toolchains.lock.json'))['cef']['version'])"
          python3 scripts/install-cef --latest
      - name: Lock entries for the pinned CEF on every platform
        run: python3 scripts/install-cef --pinned
  linux:
    name: Bridge, unit tests and the smoke test under Xvfb (CPU frames, lavapipe)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            .cache/llvm
            .cache/downloads
          key: webview-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json') }}
      - name: Pin lavapipe and validate preinstalled LLVM22
        run: python3 gpu/webgpu/scripts/setup-ci
      - name: Install X11, Wayland, Xvfb, Weston and the libraries libcef.so loads
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols xvfb weston \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxshmfence1 libpango-1.0-0 \
            libcairo2 libasound2t64 libdbus-1-3 libglib2.0-0t64 libx11-xcb1 libxext6 libexpat1
          echo "$(python3 scripts/install-silk)" >> "$GITHUB_PATH"
      - name: Install the pinned CEF
        run: python3 scripts/install-cef
      - name: The key table is current
        run: python3 platform/webview/chromium/scripts/generate-keys --check
      - name: Formatting
        run: |
          set -euo pipefail
          for package in platform/webview/chromium platform/webview/chromium/tests/smoke; do
            (cd "$package" && silkc format --check)
          done
      - name: Unit tests
        working-directory: platform/webview/chromium
        run: silkc test --root src/tests.silk
      - name: Smoke test under Xvfb
        run: python3 platform/webview/chromium/scripts/linux smoke --backend x11
      - name: The agent demo signs the guest book in Chromium under Xvfb (scripted agent)
        run: python3 ui/webview/agent/scripts/run check
  macos:
    name: macOS arm64 Chromium smoke test (CPU frames)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/webgpu
            .cache/llvm
            .cache/downloads
          key: webview-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'gpu/webgpu/scripts/ci-lock.json') }}
      - name: Install the pinned Silk compiler and LLVM 22
        run: |
          set -euo pipefail
          python3 scripts/install-silk >> "$GITHUB_PATH"
          echo "SILK_CLANG=$(python3 scripts/install-llvm)" >> "$GITHUB_ENV"
          rm -f .cache/downloads/LLVM-*.tar.xz
      - name: Chromium in a real window
        run: python3 platform/webview/chromium/scripts/smoke
  windows:
    name: Windows x64 Chromium smoke test (CPU frames)
    runs-on: windows-2025-vs2026
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
      SILK_HOME: ${{ github.workspace }}\.silk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/silk
            .cache/llvm
            .cache/downloads
            .cache/webgpu
            .cache/glfw
            .cache/webview2
          key: webview-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json') }}
      - name: Install the pinned Silk compiler and LLVM 22
        shell: pwsh
        run: |
          python scripts/install-silk >> $env:GITHUB_PATH
          $clang = python scripts/install-llvm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SILK_CLANG=$clang" >> $env:GITHUB_ENV
      - name: Chromium in a real window
        run: python platform/webview/chromium/scripts/smoke
