[package]
name = "gpu-webgpu-sys"
description = "The raw WebGPU C ABI under gpu-webgpu"
version = "0.1.0"
silk-version = "0.1.0-dev.58+9840d5811e54"
kind = "library"
exports = ["generated_webgpu"]

# Dawn's prebuilt release, pinned by hash, and the callback shim compiled against its headers.
# Both reach every executable that depends on this package. Keep the archive in step with
# toolchains.lock.json's webgpu entry (scripts/check-native-pins checks it).
[native]
sources = [
  { c = "native/callbacks.c", include = ["dawn:include"], flags = ["-std=c11", "-O2"], os = ["macos", "linux"] },
]
link = [
  { static-archive = "dawn:lib/libwebgpu_dawn.a", os = "macos" },
  { library = "c++", mode = "dynamic", os = "macos" },
  { framework = "CoreFoundation", os = "macos" },
  { framework = "Foundation", os = "macos" },
  { framework = "IOSurface", os = "macos" },
  { framework = "QuartzCore", os = "macos" },
  { framework = "Cocoa", os = "macos" },
  { framework = "IOKit", os = "macos" },
  { framework = "Metal", os = "macos" },
  { static-archive = "dawn:lib64/libwebgpu_dawn.a", os = "linux" },
  { library = "stdc++", mode = "dynamic", os = "linux" },
  { library = "m", mode = "dynamic", os = "linux" },
  { library = "dl", mode = "dynamic", os = "linux" },
  { library = "rt", mode = "dynamic", os = "linux" },
  { library = "pthread", mode = "dynamic", os = "linux" },
  # Windows links Dawn through a DLL that scripts/prepare-windows builds and names as this
  # archive's override. ABI probes and benchmark support call C stdio through the DLL CRT, whose
  # import libraries that script copies beside it, since a `library` entry for them does not
  # reach the Windows linker.
  # Silk passes include directories to Clang on Windows as \\?\ paths, where Dawn's headers are not
  # found, so prepare-windows also compiles the callback shim into that directory.
  { static-archive = "dawn:lib/nonstd_dawn.lib", os = "windows" },
  { static-archive = "dawn:lib/nonstd_callbacks.lib", os = "windows" },
  { static-archive = "dawn:lib/ucrt.lib", os = "windows" },
  { static-archive = "dawn:lib/vcruntime.lib", os = "windows" },
]

[native.archive.dawn.targets.aarch64-apple-darwin]
url = "https://github.com/google/dawn/releases/download/v20261027.184652/Dawn-106704a9ac3fc21b1580ea85aea302ac17d416f1-macos-latest-Release.tar.gz"
sha256 = "d4f419dcbe81de4b86e6fbf172b647f41c67820a925efca55dae3bd43248d8e2"
strip = 1

[native.archive.dawn.targets.x86_64-apple-darwin]
url = "https://github.com/google/dawn/releases/download/v20261027.184652/Dawn-106704a9ac3fc21b1580ea85aea302ac17d416f1-macos-15-intel-Release.tar.gz"
sha256 = "164ac7094b8b453a704a727fcd1d77b461b1143f4f4dedb5daf04c5a53f075bd"
strip = 1

[native.archive.dawn.targets.x86_64-unknown-linux-gnu]
url = "https://github.com/google/dawn/releases/download/v20261027.184652/Dawn-106704a9ac3fc21b1580ea85aea302ac17d416f1-ubuntu-latest-Release.tar.gz"
sha256 = "24fb115dc55b1e5acc169e3d2558eeda5f1b0d149af4a46f10602b900103cbd3"
strip = 1

[native.archive.dawn.targets.x86_64-pc-windows-msvc]
url = "https://github.com/google/dawn/releases/download/v20261027.184652/Dawn-106704a9ac3fc21b1580ea85aea302ac17d416f1-windows-latest-Release.tar.gz"
sha256 = "2b082c284f078b9f91a91a6b2cf805fa42c18f60b8dcaab70476a5e5e24b74ee"
strip = 1

# Browser builds use navigator.gpu and compile no native code (the shim above is limited to
# desktop systems), but Silk still checks that `dawn:` references name an archive for the target.
# This entry repeats the Linux pin to satisfy that check; a wasm32 build never fetches it.
[native.archive.dawn.targets.wasm32-unknown-unknown]
url = "https://github.com/google/dawn/releases/download/v20261027.184652/Dawn-106704a9ac3fc21b1580ea85aea302ac17d416f1-ubuntu-latest-Release.tar.gz"
sha256 = "24fb115dc55b1e5acc169e3d2558eeda5f1b0d149af4a46f10602b900103cbd3"
strip = 1
