[package]
name = "terminal-ghostty"
description = "Owned libghostty-vt terminals, keyboard and paste encoding, styled snapshots and text export"
version = "0.1.0"
silk-version = "0.1.0-dev.58+9840d5811e54"
kind = "library"
exports = ["terminal"]

[native]
sources = [
  { c = "native/input.c", include = ["ghostty-source:include"], flags = ["-std=c11", "-O2", "-Wall", "-Wextra", "-Werror"], os = ["macos", "linux"] },
  { c = "native/bridge.c", include = ["ghostty-source:include"], flags = ["-std=c11", "-O2", "-Wall", "-Wextra", "-Werror"], os = ["macos", "linux"] },
]
link = [
  { static-archive = "native/build/lib/libghostty-vt.a", os = ["macos", "linux"] },
  { library = "m", mode = "dynamic", os = "linux" },
  { library = "pthread", mode = "dynamic", os = "linux" },
]

[native.archive.ghostty-source]
url = "https://release.files.ghostty.org/libghostty-vt/1.0.0/libghostty-vt-1.0.0.tar.gz"
sha256 = "4a6ef758be721923e1969e7b81b443dcc92d8dd3fb5a39600c03a8817a753676"
strip = 1
