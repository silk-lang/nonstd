[package]
name = "graphics-gpu-scene"
description = "Draws vector scenes on WebGPU, matching the CPU renderer's output"
version = "0.1.0"
silk-version = "0.1.0-dev.51+9643805617be"
kind = "library"
exports = ["scene", "renderer", "filter", "generated_shaders"]

[dependencies]
vector = { path = "../vector", package = "graphics-vector" }
webgpu = { path = "../../native/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { path = "../../native/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
