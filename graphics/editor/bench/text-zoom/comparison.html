<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Extreme zoom text comparison</title>
<style>
body{margin:0;color:var(--foreground);font-family:var(--font-sans,system-ui)}
figure{margin:0 0 16px}figcaption{font-size:13px;margin:0 0 8px;color:var(--muted-foreground)}
img{display:block;width:100%;height:auto;border-radius:var(--radius,8px)}
summary{cursor:pointer;font-size:13px;color:var(--muted-foreground);margin:8px 0}
p{font-size:13px;line-height:1.5;color:var(--muted-foreground);margin:8px 0 16px}
</style></head><body>
<figure><figcaption>Before · capped whole-line bitmap · 64× zoom</figcaption><img src="before.png" alt="A greatly magnified serif glyph curve with blurry, visibly stepped edges"></figure>
<figure><figcaption>After · visible-window raster · same text and camera</figcaption><img src="after.png" alt="The same glyph curve with a smooth, sharply defined edge"></figure>
<details><summary>Direct browser rendering reference</summary><img src="reference.png" alt="Fresh browser rendering of the same glyph at the camera transform"></details>
<p>Georgia 24px, Chrome 155, DPR 1. Captured at 720 × 280; images scale to this panel’s width.</p>
</body></html>
