[package]
name = "graphics-editor"
description = "Retained editor documents: shapes and image tiles with stable IDs, hit tests and viewport painting"
version = "0.1.0"
silk-version = "0.1.0-dev.47+d5e63a44393e"
kind = "library"
exports = ["document"]

[dependencies]
ui_scene = { path = "../ui_scene", package = "graphics-ui-scene" }
vector = { path = "../vector", package = "graphics-vector" }
atlas = { path = "../atlas", package = "graphics-atlas" }
