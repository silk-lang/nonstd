<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silk drawing layer</title>
<style>
  html, body { margin: 0; height: 100%; background: #eef2f8; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { width: 100%; height: 100%; display: block; outline: none; }
  #error { position: fixed; left: 16px; bottom: 16px; font: 14px system-ui; color: #b00020; white-space: pre-wrap; }
</style>
<div id="stage"><canvas tabindex="0"></canvas></div>
<div id="error"></div>
<script type="module">
  import { runDemo } from './demo.js';
  const canvas = document.querySelector('#stage canvas');
  const check = new URLSearchParams(location.search).has('check');
  runDemo({ canvas, wasm: '/demo.wasm', check })
    .then(result => { window.demoResult = result; })
    .catch(error => {
      window.demoResult = { error: String(error?.message ?? error) };
      document.getElementById('error').textContent = String(error?.message ?? error);
    });
</script>
