[package]
name = "graphics-ui-scene"
description = "UI frame primitives ordered and batched for a GPU, with a CPU reference renderer"
version = "0.1.0"
silk-version = "0.1.0-dev.58+9840d5811e54"
kind = "library"
exports = ["effects", "color", "primitives", "bounds_tree", "scene", "scroll", "path_cache", "cpu"]

[dependencies]
vector = { path = "../vector", package = "graphics-vector" }
atlas = { path = "../atlas", package = "graphics-atlas" }
