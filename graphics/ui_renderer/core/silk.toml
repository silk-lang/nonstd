[package]
name = "graphics-ui-renderer"
description = "Draws a finished UI scene with WebGPU, natively and in the browser"
version = "0.1.0"
silk-version = "0.1.0-dev.47+d5e63a44393e"
kind = "library"
exports = ["text", "atlas_textures", "instances", "renderer", "generated_shaders", "readback", "compare"]

[dependencies]
vector = { path = "../../vector/core", package = "graphics-vector" }
atlas = { path = "../../atlas", package = "graphics-atlas" }
ui_scene = { path = "../../ui_scene/core", package = "graphics-ui-scene" }
gpu_scene = { path = "../../gpu_scene/core", package = "graphics-gpu-scene" }
webgpu = { path = "../../../native/gpu/webgpu/core", package = "gpu-webgpu" }
webgpu_sys = { path = "../../../native/gpu/webgpu/sys/core", package = "gpu-webgpu-sys" }
