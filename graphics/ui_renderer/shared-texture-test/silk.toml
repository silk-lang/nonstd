[package]
name = "graphics-ui-renderer-shared-texture-test"
version = "0.1.0"
silk-version = "0.1.0-dev.47+d5e63a44393e"

# Not a workspace member: on Linux the producer compiles against the system Vulkan headers and
# loader (libvulkan-dev on Ubuntu), which `silk build --workspace` does not require.
[native]
sources = [
  { c = "native/producer.c", flags = ["-std=c11", "-O2", "-Wall", "-Wextra", "-Werror", "-Wno-missing-field-initializers"], os = "linux" },
  { c = "native/producer_macos.c", flags = ["-std=c11", "-O2", "-Wall", "-Wextra", "-Werror"], os = "macos" },
]
link = [
  { library = "vulkan", mode = "dynamic", os = "linux" },
  { framework = "IOSurface", os = "macos" },
  { framework = "CoreFoundation", os = "macos" },
]

[dependencies]
vector = { path = "../../vector", package = "graphics-vector" }
atlas = { path = "../../atlas", package = "graphics-atlas" }
ui_scene = { path = "../../ui_scene", package = "graphics-ui-scene" }
ui_renderer = { path = "..", package = "graphics-ui-renderer" }
webgpu = { path = "../../../gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { path = "../../../gpu/webgpu/sys", package = "gpu-webgpu-sys" }
gpu_scene = { path = "../../gpu_scene", package = "graphics-gpu-scene" }
ui_fixtures = { path = "../fixtures", package = "graphics-ui-renderer-fixtures" }
