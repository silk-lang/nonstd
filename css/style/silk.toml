[package]
name = "css-style"
description = "CSS parsing, selectors and the cascade, from bytes to computed values"
version = "0.1.0"
silk-version = "0.1.0-dev.58+9840d5811e54"
kind = "library"
exports = [
  "tokens", "input", "element", "lexer", "syntax", "selectors", "selector_index",
  "properties", "values", "value_cursor", "value_keywords", "dimensions",
  "colors", "text_values", "effect_values", "transform_values",
  "media_queries", "media_features", "supports", "declaration_values", "encoding",
  "cascade", "variables", "computed", "computed_projection", "computed_queries", "key_index",
  "cssom_error", "cssom_serialization", "cssom_declaration", "cssom_descriptors",
  "cssom_stylesheet", "cssom_media", "cssom_document", "cssom_computed",
  "cssom_inline", "cssom_loading",
  "typed_om", "typed_om_map", "typed_om_computed", "typed_om_unparsed",
  "typed_om_numeric", "typed_om_numeric_types", "typed_om_numeric_units",
  "typed_om_numeric_parse", "typed_om_numeric_sum", "typed_om_numeric_serialization",
  "typed_om_transform", "typed_om_color",
  "cssom_geometry", "cssom_geometry_parse", "cssom_geometry_serialization",
  "cssom_view", "cssom_view_geometry", "cssom_view_window",
]

[dependencies]
svg_geometry = { path = "../../graphics/geometry", package = "graphics-geometry" }
