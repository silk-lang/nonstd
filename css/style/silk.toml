[package]
name = "css-style"
description = "CSS parsing, selectors and the cascade, from bytes to computed values"
version = "0.1.0"
silk-version = "0.1.0-dev.51+9643805617be"
kind = "library"
exports = [
  "tokens", "input", "element", "lexer", "syntax", "selectors", "selector_index",
  "properties", "values", "value_cursor", "value_keywords", "dimensions",
  "colors", "text_values", "effect_values", "transform_values",
  "media_queries", "media_features", "supports", "declaration_values", "encoding",
  "cascade", "variables", "computed", "computed_projection", "computed_queries", "key_index",
]

[dependencies]
svg_geometry = { path = "../../graphics/geometry", package = "graphics-geometry" }
