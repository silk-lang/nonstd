[package]
name = "gpu-metal"
version = "0.1.0"
silk-version = "0.1.0-dev.31+2fc1811f535e"
source = "src"
main = "runtime.silk"
kind = "static-library"
exports = ["runtime", "types", "core", "device", "encoder", "resources", "pipeline", "library", "raytracing"]

[native]
link = [
  { object = "native/build/core.o" },
  { object = "native/build/runtime.o" },
  { object = "native/build/device.o" },
  { object = "native/build/encoder.o" },
  { object = "native/build/resources.o" },
  { object = "native/build/pipeline.o" },
  { object = "native/build/library.o" },
  { object = "native/build/raytracing.o" },
]

