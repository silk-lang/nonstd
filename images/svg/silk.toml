[package]
name = "images-svg"
description = "An SVG renderer written from the SVG 1.1 and SVG 2 specifications"
version = "0.1.0"
silk-version = "0.1.0-dev.47+d5e63a44393e"
kind = "library"
exports = ["image_assets", "xml_text", "mask_layer_sources", "svg_intrinsic", "scene", "mapping", "resolve", "url", "resources", "resources_native", "style_tree", "stylesheets", "document_styles", "font_metrics", "vector_path", "view_fragment", "view_selection", "conditional", "structure", "occurrence_tree", "animation", "css_animations", "color_profiles"]

[dependencies]
svg_geometry = { path = "../../graphics/geometry", package = "graphics-geometry" }
svg_css = { path = "../../css/style", package = "css-style" }
svg_image = { path = "../../graphics/codec", package = "graphics-codec" }
font_types = { path = "../../font/types", package = "font-types" }
read_fonts = { path = "../../font/parse", package = "font-parse" }
harfrust = { path = "../../font/shape", package = "font-shape" }
vector = { path = "../../graphics/vector", package = "graphics-vector" }
svg_filters = { path = "filters", package = "images-svg-filters" }
svg_fonts = { path = "../../font/faces", package = "font-faces" }
svg_text = { path = "text", package = "images-svg-text" }
