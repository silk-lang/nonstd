[package]
name = "images-svg-text"
description = "SVG text layout: font selection, shaping, positioning and glyph outlines"
version = "0.1.0"
silk-version = "0.1.0-dev.47+d5e63a44393e"
kind = "library"
exports = ["lib", "layout", "lines", "areas", "paths", "on_path"]

[dependencies]
svg_fonts = { path = "../../../font/faces", package = "font-faces" }
harfrust = { path = "../../../font/shape", package = "font-shape" }
read_fonts = { path = "../../../font/parse", package = "font-parse" }
font_types = { path = "../../../font/types", package = "font-types" }
svg_geometry = { path = "../../../graphics/geometry", package = "graphics-geometry" }
font_outline = { path = "../../../font/outline", package = "font-outline" }
