[package]
name = "images-svg-render"
version = "0.1.0"
silk-version = "0.1.0-dev.31+2fc1811f535e"
kind = "library"
exports = ["lib", "record", "environment", "native_environment"]

[dependencies]
svg_core = { path = "..", package = "images-svg" }
svg_raster = { path = "../raster", package = "images-svg-raster" }
svg_xml = { path = "../../../text/xml", package = "text-xml" }
svg_css = { path = "../../../css/style", package = "css-style" }
read_fonts = { path = "../../../font/parse", package = "font-parse" }
# CPU output is the backend-owned pixmap; encoding borrows its pixels without a copy.
vector = { path = "../vector", package = "images-svg-vector" }
