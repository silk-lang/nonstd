<!-- Independent literal control: oversize content clips to the positioned viewport; the following sibling is not clipped. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="16">
  <rect x="4" y="4" width="8" height="8" fill="blue"/>
  <rect x="24" y="2" width="4" height="4" fill="green"/>
</svg>
