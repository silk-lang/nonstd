<svg xmlns="http://www.w3.org/2000/svg" width="32" height="16">
  <!-- SVG2 pservers §14.4; resource-local vector-effect host policy SVGWG #2448. -->
  <defs>
    <linearGradient id="g"><stop offset=".5" stop-color="red"/><stop offset=".5" stop-color="blue"/></linearGradient>
    <pattern id="inner" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="url(#g)"/>
      <path d="M2 0V4" stroke="black" stroke-width="1" vector-effect="non-scaling-stroke"/>
    </pattern>
    <pattern id="outer" patternUnits="userSpaceOnUse" width="8" height="4" patternTransform="scale(2)">
      <rect width="8" height="4" fill="url(#inner)"/>
    </pattern>
  </defs>
  <rect width="32" height="16" fill="url(#outer)"/>
</svg>
