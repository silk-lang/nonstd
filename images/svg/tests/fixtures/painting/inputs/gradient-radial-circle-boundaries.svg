<!-- https://www.w3.org/TR/2018/CR-SVG2-20181004/pservers.html#RadialGradientNotes; Independent half-stop circles cover off-center fx/fy/fr, equal positive radii with distinct centers, and fr greater than r without focal-radius clamping. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="12">
<defs><radialGradient id="offset" gradientUnits="userSpaceOnUse" cx="6" cy="6" r="6" fx="4" fy="6" fr="2"><stop offset="0" stop-color="red"/><stop offset=".5" stop-color="red"/><stop offset=".5" stop-color="blue"/><stop offset="1" stop-color="blue"/></radialGradient><radialGradient id="equal" gradientUnits="userSpaceOnUse" cx="8" cy="6" r="2" fx="4" fy="6" fr="2"><stop offset="0" stop-color="red"/><stop offset=".5" stop-color="red"/><stop offset=".5" stop-color="blue"/><stop offset="1" stop-color="blue"/></radialGradient><radialGradient id="shrink" gradientUnits="userSpaceOnUse" cx="6" cy="6" r="2" fr="6"><stop offset="0" stop-color="red"/><stop offset=".5" stop-color="red"/><stop offset=".5" stop-color="blue"/><stop offset="1" stop-color="blue"/></radialGradient></defs><g transform="translate(0 0)"><rect x="0" y="0" width="12" height="12" fill="url(#offset)"/></g><g transform="translate(12 0)"><rect x="0" y="0" width="12" height="12" fill="url(#equal)"/></g><g transform="translate(24 0)"><rect x="0" y="0" width="12" height="12" fill="url(#shrink)"/></g>
</svg>
