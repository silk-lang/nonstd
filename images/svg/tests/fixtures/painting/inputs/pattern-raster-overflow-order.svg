<svg xmlns="http://www.w3.org/2000/svg" width="32" height="16">
  <!-- SVG2 CR2018 pservers §14.4; SVGWG #129 row-major overflow policy. -->
  <defs>
    <pattern id="p" patternUnits="userSpaceOnUse" width="4" height="4" overflow="visible">
      <rect x="-8" y="-8" width="12" height="12" fill="red" fill-opacity=".25"/>
      <rect x="-8" y="-8" width="4" height="4" fill="blue" fill-opacity=".25"/>
    </pattern>
  </defs>
  <rect width="32" height="16" fill="url(#p)"/>
</svg>
