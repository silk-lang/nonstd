<!-- https://www.w3.org/TR/2018/CR-SVG2-20181004/coords.html#ObjectBoundingBox; Zero-height object bounds suppress bbox stroke paint without activating URL fallback; userSpace percentages use the 24-unit SVG viewport, and normalized bbox radial circles map to an ellipse. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="16">
<defs><linearGradient id="box"><stop offset="0" stop-color="red"/><stop offset=".5" stop-color="red"/><stop offset=".5" stop-color="blue"/><stop offset="1" stop-color="blue"/></linearGradient><linearGradient id="user" gradientUnits="userSpaceOnUse" x2="100%"><stop offset="0" stop-color="red"/><stop offset=".5" stop-color="red"/><stop offset=".5" stop-color="blue"/><stop offset="1" stop-color="blue"/></linearGradient><radialGradient id="ellipse"><stop offset="0" stop-color="red"/><stop offset=".5" stop-color="red"/><stop offset=".5" stop-color="blue"/><stop offset="1" stop-color="blue"/></radialGradient></defs><path d="M 2 2 H 14" fill="none" stroke="url(#box) lime" stroke-width="2"/><path d="M 2 5 H 14" fill="none" stroke="url(#user)" stroke-width="2"/><rect x="4" y="8" width="16" height="8" fill="url(#ellipse)"/>
</svg>
