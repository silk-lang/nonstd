<!-- https://www.w3.org/TR/2018/CR-SVG2-20181004/pservers.html#RadialGradientNotes; Object-bbox zero dimensions suppress even one-stop paint; otherwise zero/one stops resolve before geometric distribution, while two-or-more-stop identical circles (including radius zero) paint nothing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="8">
<defs><radialGradient id="zero" r="0"><stop offset="0" stop-color="red"/><stop offset=".5" stop-color="red"/><stop offset=".5" stop-color="blue"/><stop offset="1" stop-color="blue"/></radialGradient><radialGradient id="same" r=".5" fr=".5"><stop offset="0" stop-color="red"/><stop offset=".5" stop-color="red"/><stop offset=".5" stop-color="blue"/><stop offset="1" stop-color="blue"/></radialGradient><radialGradient id="single" r="0"><stop stop-color="lime"/></radialGradient><radialGradient id="singleSame" r=".5" fr=".5"><stop stop-color="lime"/></radialGradient><radialGradient id="bbox"><stop stop-color="red"/></radialGradient></defs><rect x="0" y="0" width="32" height="8" fill="white"/><rect x="0" y="0" width="8" height="8" fill="url(#zero)"/><rect x="8" y="0" width="8" height="8" fill="url(#same)"/><rect x="16" y="0" width="8" height="8" fill="url(#single)"/><rect x="24" y="0" width="8" height="8" fill="url(#singleSame)"/><path d="M 1 4 H 31" fill="none" stroke="url(#bbox)" stroke-width="2"/>
</svg>
