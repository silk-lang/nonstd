<!-- https://www.w3.org/TR/2018/CR-SVG2-20181004/pservers.html#PaintServerTemplates; Linear-radial-linear and radial-linear-radial chains retain distant same-kind coordinates; common units/spread/transform and cloned stops cross kinds, local stops replace them, and CSS translation overrides template translation. -->
<svg xmlns="http://www.w3.org/2000/svg" width="28" height="12">
<defs><linearGradient id="tail" gradientUnits="userSpaceOnUse" x1="2" x2="6" spreadMethod="reflect" gradientTransform="translate(1 0)"><stop offset="0" stop-color="red"/><stop offset=".5" stop-color="red"/><stop offset=".5" stop-color="blue"/><stop offset="1" stop-color="blue"/></linearGradient><radialGradient id="middle" href="#tail" cx="999"/><linearGradient id="chain" href="#middle"><title>Descriptive content does not replace stops</title></linearGradient><linearGradient id="css" href="#middle" style="transform:translateX(3px)"/><linearGradient id="local" href="#middle" x2="10"><stop stop-color="lime"/><stop offset=".5" stop-color="lime"/><stop offset=".5" stop-color="yellow"/><stop offset="1" stop-color="yellow"/></linearGradient><radialGradient id="rtail" gradientUnits="userSpaceOnUse" cx="6" cy="6" r="6" fr="2"><stop offset="0" stop-color="red"/><stop offset=".5" stop-color="red"/><stop offset=".5" stop-color="blue"/><stop offset="1" stop-color="blue"/></radialGradient><linearGradient id="rmiddle" href="#rtail" x2="999"/><radialGradient id="rchain" href="#rmiddle"/></defs><rect x="0" y="0" width="16" height="4" fill="url(#chain)"/><rect x="0" y="4" width="16" height="4" fill="url(#css)"/><rect x="0" y="8" width="16" height="4" fill="url(#local)"/><g transform="translate(16 0)"><rect x="0" y="0" width="12" height="12" fill="url(#rchain)"/></g>
</svg>
