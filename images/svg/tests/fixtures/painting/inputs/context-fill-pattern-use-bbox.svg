<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100">
  <!-- The context element is the use; its user space and bounding box place the pattern for both rectangles, whatever their own transforms. -->
  <pattern id="p" patternContentUnits="objectBoundingBox" width="0.5" height="0.5">
    <rect width="0.25" height="0.25" fill="green"/>
  </pattern>
  <defs>
    <g id="g" transform="scale(2 1)">
      <rect width="25" height="100" fill="context-fill"/>
      <rect width="50" height="100" transform="translate(25 0) scale(0.5 1)" fill="context-fill"/>
    </g>
  </defs>
  <use xlink:href="#g" fill="url(#p)"/>
</svg>
