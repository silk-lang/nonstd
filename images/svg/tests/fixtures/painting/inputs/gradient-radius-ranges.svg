<!-- https://www.w3.org/TR/2018/CR-SVG2-20181004/pservers.html#RadialGradientElementRAttribute; Negative literals are unspecified before template lookup; negative calc radii clamp to zero after expression selection and percentage evaluation, never fall back to template radii. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="12">
<defs><radialGradient id="base" gradientUnits="userSpaceOnUse" cx="6" cy="6" r="6" fr="2"><stop offset="0" stop-color="red"/><stop offset=".5" stop-color="red"/><stop offset=".5" stop-color="blue"/><stop offset="1" stop-color="blue"/></radialGradient><radialGradient id="literal" href="#base" r="-1" fr="-2"/><radialGradient id="calcfr" href="#base" fr="calc(1px - 3px)"/><radialGradient id="calcr" href="#base" r="calc(10% - 100px)"/></defs><g transform="translate(0 0)"><rect x="0" y="0" width="12" height="12" fill="url(#literal)"/></g><g transform="translate(12 0)"><rect x="0" y="0" width="12" height="12" fill="url(#calcfr)"/></g><g transform="translate(24 0)"><rect x="0" y="0" width="12" height="12" fill="url(#calcr)"/></g>
</svg>
